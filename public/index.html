<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Home Taste"><title>Order online</title><link rel="stylesheet" href="/style.css"><link rel="manifest" href="/order.webmanifest"><meta name="theme-color" content="#ff6a13"><link rel="icon" type="image/png" href="/favicon.png"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png"></head>
<body><div id="root"></div><div id="toast"></div>
<script src="/common.js"></script><script src="/loc.js"></script>
<script>
const SL=(()=>{try{return JSON.parse(localStorage.cloc||'{}')}catch{return{}}})();
const SV=(()=>{try{return JSON.parse(localStorage.ccart||'{}')}catch{return{}}})();
const S={tok:localStorage.ctok||'',user:JSON.parse(localStorage.cuser||'null'),prods:[],cats:[],cfg:{},cart:SV.cart||{},cat:'',q:'',mode:'in',tab:'menu',type:SV.type||'dine_in',method:SV.method||'cash',note:'',stages:{},fulfil:SV.fulfil||'pickup',addr:localStorage.caddr||'',ins:'',cph:'',chat:[],cseen:null,catAll:false,lat:SL.lat??null,lng:SL.lng??null};
const getTok=()=>S.tok,onAuthFail=()=>A.out();
const logo=()=>`<img class=logo src="${S.cfg.logo?'/img/'+S.cfg.logo:'/logo-mark.png'}" alt="logo">`,logoFull=()=>`<img class="logo wide" src="${S.cfg.logo?'/img/'+S.cfg.logo:'/logo-full.png'}" alt="logo">`;
const fee=q=>S.type=='takeaway'?(+S.cfg.packing||0)*q:0,dfee=()=>S.type=='takeaway'&&S.fulfil=='delivery'?(+S.cfg.delivery_fee||0):0;
const ST=o=>o.status=='paid'?['Paid','paid']:o.status=='cancelled'?['Cancelled','cancelled']:[o.pay_pref=='cash'?'Pay at counter':'Confirming payment','open'];
const cleanCart=()=>{for(const k of Object.keys(S.cart)){const p=S.prods.find(x=>x.id==cpid(k));if(!p||soldout(p))delete S.cart[k]}for(const p of S.prods){if(p.stock==null)continue;let over=inCart(p.id)-p.stock;for(const k of Object.keys(S.cart)){if(over<=0)break;if(cpid(k)==p.id){const d=Math.min(S.cart[k],over);S.cart[k]-=d;over-=d;if(!S.cart[k])delete S.cart[k]}}}};
const curCat=()=>{const n=S.cats.filter(c=>S.prods.some(p=>p.category==c.name)).map(c=>c.name);return n.includes(S.cat)?S.cat:(n[0]||'')};
const boot=run(async()=>{[S.cfg,S.cats,S.prods]=await Promise.all([api('settings'),api('categories'),api('c/menu')]);document.title='Order · '+S.cfg.name;cleanCart();render()});
const onProfile=run(async()=>{Object.assign(S.user,await api('c/me'));localStorage.cuser=JSON.stringify(S.user);render()});
const qty=()=>Object.values(S.cart).reduce((a,b)=>a+b,0);
function render(){
if(!S.user){const up=S.mode=='up';$('#root').innerHTML=`<div class=auth><div class=ah>${logoFull()}<h1>${esc(S.cfg.name)}</h1><p>Delicious meals, hot from our kitchen. Order in a few taps and follow it live.</p><ul><li>${ic('utensils')}Fresh, made-to-order meals</li><li>${ic('bike')}Track your order live</li><li>${ic('cash')}Pay with cash or mobile money</li></ul></div><div class=af><form id=lf><div class=seg2><button type=button class="${up?'':'on'}" data-a=mode data-v=in>Sign in</button><button type=button class="${up?'on':''}" data-a=mode data-v=up>Create account</button></div><h2>${up?'Join us':'Welcome back'}</h2><small>${up?'It takes less than a minute.':'Sign in to start ordering.'}</small>${up?`<div class=fld>${ic('user',18)}<input id=nm placeholder="Full name" autocomplete=name required></div>`:''}<div class=fld>${ic('phone',18)}<input id=ph type=tel placeholder="Phone number" autocomplete=tel required></div><div class=fld>${ic('lock',18)}<input id=pw type=password placeholder="Password (6+ characters)" autocomplete=${up?'new-password':'current-password'} required><button type=button class=eye data-a=eye aria-label="Show password">${ic('eye',18)}</button></div><div class=ferr id=ferr hidden></div><button class="btn big" id=lbtn>${up?'Create account':'Sign in'}</button>${up?'':`<small>Forgot your password? <a href="${telHref(phones(S.cfg.phones)[0]||'')}">Call us</a></small>`}<small class=stafflink><a href=/staff>Staff sign in</a></small></form></div></div>`;return}
$('#root').innerHTML=`<header class=top><div class=tbrand>${logo()}<span>${esc(S.cfg.name)}</span></div><div class=tl>${[['menu','Menu'],['orders','My orders'],['contact','Contact'],['profile','Profile']].map(([v,l])=>`<button class="${S.tab==v?'on':''}" data-a=tab data-v=${v}>${l}</button>`).join('')}</div><button class="ib cn" data-a=tab data-v=contact aria-label="Contact us">${ic('chat',22)}</button></header><div class=wrap id=main></div><div class=bn role=navigation><button class="${S.tab=='menu'?'on':''}" data-a=tab data-v=menu>${ic('home',22)}<span>Home</span></button><button class="${S.tab=='orders'?'on':''}" data-a=tab data-v=orders>${ic('receipt',22)}<span>My orders</span></button><button class="${S.tab=='profile'?'on':''}" data-a=tab data-v=profile>${ic('user',22)}<span>Profile</span></button><button class=bcart data-a=copen>${ic('bag',22)}<span>Cart</span><i class=bdg id=cb></i></button></div><i id=cbar hidden></i>`;main();const cb=$('#cb');if(cb)cb.textContent=qty()||''}
function main(){document.body.classList.remove('nv','lock','mlock');$('#cbar').innerHTML='';
if(S.tab=='contact')return contactPage();if(S.tab=='orders')return orders();if(S.tab=='profile')return run(async()=>{await profileView('c/me',$('#main'));$('#main').insertAdjacentHTML('beforeend',`<div class="card prof" style="margin-top:16px;display:grid;gap:10px"><button class="btn ghost" data-a=tab data-v=contact>${ic('chat',18)} Contact us</button><button class="btn ghost" data-a=install>${ic('download',18)} Install app</button><button class="btn ghost" data-a=out>${ic('logout',18)} Sign out</button></div>`)})();
$('#main').innerHTML=`<div class=hero><h1>${greet()}, ${esc(S.user.name.split(' ')[0])}.<br>What are you craving?</h1><p>Fresh from our kitchen to you.</p><div class=sb>${ic('search',20)}<input id=q placeholder="Search for a dish" value="${esc(S.q)}"></div></div><div class=pos><section><div class="cats big" id=cats></div><div id=cmore></div><div id=pop></div><div id=sp></div><div class=sh2><h3 id=mh>Our menu</h3></div><div class=grid id=grid></div></section><aside class=cart id=cart></aside></div>`;drawMenu();drawCart()}
function drawGrid(){const k=curCat(),q=S.q.toLowerCase(),f=S.prods.filter(p=>q?p.name.toLowerCase().includes(q):p.category==k),sp=S.prods.filter(p=>p.offer_percent>0&&!soldout(p));$('#sp').innerHTML=!q&&sp.length?`<div class=spbox><div class=sph>${ic('tag',20)}<div><h3>Special offers</h3><small>Limited deals, grab them while they last</small></div></div><div class=grid>${sp.map(p=>tile(p,inCart(p.id))).join('')}</div></div>`:'';const pk=S.prods.filter(p=>!soldout(p)),sold=pk.filter(p=>p.sold>0).sort((a,b)=>b.sold-a.sold),rest=pk.filter(p=>!(p.sold>0)),pop=[...sold,...rest].slice(0,8);$('#pop').innerHTML=!q&&pop.length>=3?`<div class=popb><div class=row><h3>${sold.length?'Popular right now':'Featured dishes'}</h3><small>Swipe for more</small></div><div class=hscroll>${pop.map(p=>tile(p,inCart(p.id))).join('')}</div></div>`:'';
$('#mh').textContent=q?'Search results':k||'Our menu';$('#grid').innerHTML=f.map(p=>tile(p,inCart(p.id))).join('')||'<p class=empty>Nothing here right now</p>'}
const catsAll=()=>S.cats.filter(c=>S.prods.some(p=>p.category==c.name));
function drawMenu(){const all=catsAll(),k=curCat();let sh=all;if(!S.catAll&&all.length>6){sh=all.slice(0,6);if(!sh.some(c=>c.name==k)){const cur=all.find(c=>c.name==k);if(cur)sh[5]=cur}}
$('#cats').innerHTML=sh.map(c=>`<button class="cat ${c.name==k?'on':''}" data-a=cat data-v="${esc(c.name)}">${pic(c.image_id,'utensils','round')}<span>${esc(c.name)}</span></button>`).join('');
$('#cmore').innerHTML=all.length>6?`<button class=vm data-a=catmore>${S.catAll?'View less':'View more'} ${ic(S.catAll?'chevup':'chevdown',16)}</button>`:'';drawGrid()}
function drawCart(){localStorage.ccart=JSON.stringify({cart:S.cart,type:S.type,fulfil:S.fulfil,method:S.method});const L=cartLines(),Q=L.reduce((s,x)=>s+x.q,0),QP=L.filter(x=>x.p.pack).reduce((s,x)=>s+x.q,0),sub=L.reduce((s,x)=>s+unitP(x.p,x.opt)*x.q,0),F=feeL(L),DF=dfee(),m=S.method,MF=(m=='mtn'||m=='airtel')?(+S.cfg.momo_fee||0):0,T=sub+F+DF+MF,d=S.type=='dine_in',dv=!d&&S.fulfil=='delivery',code=m=='mtn'?S.cfg.mtn:S.cfg.airtel,pk=+S.cfg.packing||0,df=+S.cfg.delivery_fee||0;
const cb=$('#cb');if(cb)cb.textContent=Q||'';
if($('#cbar'))$('#cbar').innerHTML=Q?`<span class=cl>${ic('bag',20)}<b>${Q}</b></span><span>View cart</span><span>${fmt(T)}</span>`:'';
const pc=(x,b)=>`<button class="pc ${m==x?'on':''}" data-a=method data-v=${x}>${b}<b>${PMN[x]}</b>${x!='cash'&&(+S.cfg.momo_fee||0)?`<small>+${fmt(+S.cfg.momo_fee)} fee</small>`:''}</button>`;
$('#cart').innerHTML=`<div class=sh-head><button class=ib data-a=cclose>${ic('left',22)}</button><h3>${L.length?'Checkout':'Your cart'}</h3></div>${L.length?`
<div class=sec><h4>Your order</h4>${L.map(x=>`<div class=ln2>${pic(x.p.image_id,'utensils','sq')}<div class=g><b>${esc(x.p.name)}</b><small>${fmt(unitP(x.p,x.opt))}${lineDesc(x)?' · '+esc(lineDesc(x)):''}</small></div><div class=qs><button data-a=dec data-v="${x.k}">${ic('minus',16)}</button><b>${x.q}</b><button data-a=add data-v="${x.k}">${ic('plus',16)}</button></div></div>`).join('')}</div>
<div class=sec><h4>How would you like it?</h4><div class=opts><button class="opt ${d?'on':''}" data-a=type data-v=dine_in>${ic('utensils',22)}<b>Dine in</b><small>Eat at the restaurant</small></button><button class="opt ${d?'':'on'}" data-a=type data-v=takeaway>${ic('bag',22)}<b>Take away</b><small>Packed to go${pk?' · +'+fmt(pk)+' per food plate (drinks free)':''}</small></button></div>
${d?`<div class=fld>${ic('pencil',18)}<input id=note placeholder="Table number (optional)" value="${esc(S.note)}"></div>`:`<h4 style="margin-top:4px">Pickup or delivery</h4><div class=opts><button class="opt ${dv?'':'on'}" data-a=fulfil data-v=pickup>${ic('pin',22)}<b>Self pickup</b><small>Collect it from us</small></button><button class="opt ${dv?'on':''}" data-a=fulfil data-v=delivery>${ic('bike',22)}<b>Delivery</b><small>We bring it to you · +${fmt(df)}</small></button></div>${dv?`<div class=dlv><button class="btn ghost" data-a=gps>${ic('pin',18)} Use my current location</button><div class=fld>${ic('search',18)}<input id=lsearch placeholder="Search your area or landmark"></div><div class=lm id=lmap></div><small class=lhint>${S.lat!=null?'Pin set. Drag it to fine-tune.':'Tap the map or use your location to drop a pin.'}</small><div class=fld>${ic('pin',18)}<input id=addr placeholder="Address or landmark (filled in from your pin)" value="${esc(S.addr)}"></div><div class=fld>${ic('phone',18)}<input id=cph type=tel placeholder="Phone number for the rider" value="${esc(S.cph||S.user.phone||'')}"></div><div class=fld>${ic('pencil',18)}<input id=ins placeholder="Delivery instructions (gate, floor, who to ask for)" value="${esc(S.ins)}"></div></div>`:`<div class=fld>${ic('pencil',18)}<input id=note placeholder="Note for pickup (optional)" value="${esc(S.note)}"></div>`}`}</div>
<div class=sec><h4>Payment</h4><div class=pays>${pc('cash',`<span class="bg cashb">${ic('cash',18)}</span>`)}${pc('mtn','<span class="bg mtnb">MTN</span>')}${pc('airtel','<span class="bg airb">airtel</span>')}</div>${m=='cash'?`<div class=codec style="margin-top:12px"><small>${dv?'You will pay cash to the rider on delivery.':'You will pay with cash at the counter.'}</small></div>`:`<div class=codec><small>${PMN[m]} merchant code</small><div class=code>${esc(code)}<button class=cp data-a=copy data-v="${esc(code)}">${ic('copy',16)} Copy</button></div><small>Pay ${fmt(T)} to this code (includes ${fmt(MF)} mobile money fee to cover withdrawal charges). Our team will confirm your payment.</small></div>`}</div>
<div class=sec><div class=sum><div><span>Subtotal</span><span>${fmt(sub)}</span></div>${F?`<div><span>Packing (${QP} plate${QP>1?'s':''})</span><span>${fmt(F)}</span></div>`:''}${DF?`<div><span>Delivery fee</span><span>${fmt(DF)}</span></div>`:''}${MF?`<div><span>Mobile money fee</span><span>${fmt(MF)}</span></div>`:''}<div class=t><span>Total</span><span>${fmt(T)}</span></div></div></div>
<div class=foot><button class="btn big" data-a=order>Place order · ${fmt(T)}</button><small class=fine>Your order goes straight to our kitchen.</small></div>`:`<div class=emptyc>${ic('bag',44)}<h4>Your cart is empty</h4><p>Add dishes from the menu to get started.</p><button class="btn ghost" style="width:auto;padding:0 22px" data-a=cclose>Browse menu</button></div>`}`;if(dv&&$('#lmap'))locMount($('#lmap'),onLoc)}
function drawOrders(os){$('#main').innerHTML=`<div class=pg><div class=row><h2 style="margin-top:0">My orders</h2><button class="sm ghost" data-a=tab data-v=orders>Refresh</button></div><div class=ocards>${os.map(o=>{const[t,c]=ST(o),tk=o.order_type=='takeaway';return`<div class="card oc"><div class=row><b>Order #${o.id}</b><span class="badge ${c}">${t}</span></div><div class=tags><span class=tag>${ic(tk?(o.fulfil=='delivery'?'bike':'bag'):'utensils',13)} ${tk?(o.fulfil=='delivery'?'Delivery':'Self pickup'):'Dine in'}</span><span class=tag>${new Date(o.created_at).toLocaleString([],{dateStyle:'short',timeStyle:'short'})}</span></div>${o.fulfil=='delivery'&&o.address?`<small>${ic('pin',13)} ${esc(o.address)}</small>`:''}${o.rider_name?`<div class=info>${ic('bike',15)} Your rider <b>${esc(o.rider_name)}</b> is on the way${o.rider_phone?` · <a href="${telHref(o.rider_phone)}">Call rider</a>`:''}</div>`:''}${o.status=='cancelled'?'':tracker(o.stage)}<ul class=its>${(o.items||[]).map(i=>`<li>${i.qty} × ${esc(i.name)}${i.sides?` <small>(${esc(i.sides)})</small>`:''}</li>`).join('')}</ul><div class=amtr><span>Total</span><span>${fmt(o.total)}</span></div></div>`}).join('')||'<p class=empty>No orders yet</p>'}</div></div>`}
const orders=run(async()=>drawOrders(await api('c/orders')));
function drawChat(){const el=$('#msgs');if(!el)return;el.innerHTML=S.chat.map(m=>`<div class="bub ${m.sender=='customer'?'me':'st'}">${esc(m.body)}<small>${new Date(m.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</small></div>`).join('')||'<p class=empty style="margin:auto">Say hello. Our team will reply here.</p>';el.scrollTop=el.scrollHeight}
const loadChat=run(async()=>{S.chat=await api('c/chat');drawChat()});
const chatRefresh=()=>api('c/chat').then(m=>{if(m.length!=S.chat.length){S.chat=m;drawChat()}}).catch(()=>{});
function contactPage(){const c=S.cfg,card=(href,i,t,sub,cls)=>`<a class="cc ${cls||''}" href="${href}" ${href.startsWith('http')?'target=_blank rel=noopener':''}><span class=ci>${ic(i,22)}</span><span><b>${t}</b><small>${sub}</small></span></a>`;
$('#main').innerHTML=`<div class=pg><h2 style="margin-top:0">Contact us</h2><small>We would love to hear from you. Pick the way that suits you best.</small><div class=ccs>${phones(c.phones).map(p=>card(telHref(p),'phone','Call us',esc(p))).join('')}${c.whatsapp?card(waHref(c.whatsapp,'Hello '+c.name+', '),'whatsapp','WhatsApp','Message us on WhatsApp','wa'):''}${c.email?card('mailto:'+esc(c.email),'mail','Email',esc(c.email)):''}${safeUrl(c.facebook)?card(esc(c.facebook),'facebook','Facebook','Follow our page','fb'):''}${safeUrl(c.instagram)?card(esc(c.instagram),'instagram','Instagram','@home.taste.foods','ig'):''}${card('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(c.address+' '+c.name),'pin','Visit us',esc(c.address))}</div><div class="card chatc"><div class=row><h3 style="margin:0">Live chat</h3><small>We reply as soon as we can</small></div><div class=msgs id=msgs></div><div class=cin><input id=cmsg placeholder="Type your message" autocomplete=off><button class=btn data-a=csend aria-label=Send>${ic('send',20)}</button></div></div></div>`;loadChat()}
async function cpoll(){if(!S.user)return;try{const os=await api('c/orders');for(const o of os){const was=S.stages[o.id];if(was&&was!=o.stage&&o.status!='cancelled'){const l=STG.find(x=>x[0]==o.stage);toast(`Order #${o.id}: ${l[2]}`);beep();if(o.stage=='ready'||o.stage=='delivering')confetti()}S.stages[o.id]=o.stage}if(S.tab=='orders')drawOrders(os);const ch=await api('c/chat'),st=ch.filter(m=>m.sender=='staff').length;if(S.cseen!=null&&st>S.cseen&&S.tab!='contact'){toast('New message from '+S.cfg.name);beep()}S.cseen=st}catch{}}
const addToCart=(k,q,quiet)=>{const id=cpid(k),p=S.prods.find(x=>x.id==id);if(!p||soldout(p))return toast('Sold out');if(p.stock!=null&&inCart(id)+q>p.stock)return toast(`Only ${p.stock} plate(s) left`);S.cart[k]=(S.cart[k]||0)+q;drawGrid();drawCart();if(!quiet)toast(`${q} x ${p.name} added`)};
const onLoc=async(lat,lng)=>{S.lat=lat;S.lng=lng;localStorage.cloc=JSON.stringify({lat,lng});const h=$('.lhint');if(h)h.textContent='Pin set. Drag it to fine-tune.';const a=await locAddr(lat,lng);if(a){S.addr=a;localStorage.caddr=a;const i=$('#addr');if(i)i.value=a}};
Object.assign(A,{
mode:v=>{S.mode=v;render()},out:()=>{localStorage.removeItem('ccart');localStorage.removeItem('ctok');localStorage.removeItem('cuser');S.tok='';S.user=null;S.cart={};render()},
tab:v=>{S.tab=v;render()},cat:v=>{S.cat=v;S.q='';const i=$('#q');if(i)i.value='';drawMenu()},
copen:()=>{if(S.tab!='menu'){S.tab='menu';render()}$('#cart').classList.add('open');document.body.classList.add('lock')},
add:v=>addToCart(v,1,1),
dec:v=>{if(--S.cart[v]<=0)delete S.cart[v];drawGrid();drawCart()},type:v=>{S.type=v;drawCart()},method:v=>{S.method=v;drawCart()},
go:async()=>{const f=$('#ferr'),bt=$('#lbtn');if(!f)return;f.hidden=true;bt.disabled=true;bt.classList.add('ld');try{const b={phone:$('#ph').value,password:$('#pw').value};if(S.mode=='up')b.name=$('#nm').value;const j=await api('c/'+(S.mode=='up'?'register':'login'),'POST',b);S.tok=localStorage.ctok=j.token;S.user=j.user;localStorage.cuser=JSON.stringify(j.user);S.tab='menu';cleanCart();render()}catch(e){f.textContent=e.message;f.hidden=false;bt.disabled=false;bt.classList.remove('ld')}},
order:run(async()=>{const dv=S.type=='takeaway'&&S.fulfil=='delivery';if(dv&&!S.addr.trim()&&S.lat==null)throw new Error('Please pin your location or enter your delivery address');try{await api('c/orders','POST',{items:cartItems(),method:S.method,note:S.note,type:S.type,fulfil:S.fulfil,address:S.addr,instructions:S.ins,contact:S.cph||S.user.phone,lat:dv?S.lat:null,lng:dv?S.lng:null})}catch(e){S.prods=await api('c/menu');S.cart={};drawGrid();drawCart();throw e}if(dv)localStorage.caddr=S.addr;S.cart={};S.note=S.ins='';S.tab='orders';render();confetti();toast('Order placed. We are on it!');S.prods=await api('c/menu')}),
fulfil:v=>{S.fulfil=v;drawCart()},
catmore:()=>{S.catAll=!S.catAll;drawMenu()},
gps:run(async()=>{toast('Finding your location...');const p=await locGps();await locMount($('#lmap'),onLoc);locSet(p.lat,p.lng);await onLoc(p.lat,p.lng)}),
lsearch:run(async()=>{const q=($('#lsearch')||{}).value;if(!q||!q.trim())return;await locMount($('#lmap'),onLoc);const p=await locFind(q.trim());if(!p)throw new Error('We could not find that place. Try another name or tap the map.');locSet(p.lat,p.lng);await onLoc(p.lat,p.lng)}),
csend:run(async()=>{const i=$('#cmsg'),b=i.value.trim();if(!b)return;i.value='';await api('c/chat','POST',{body:b});S.chat=await api('c/chat');drawChat()})});
document.addEventListener('input',e=>{const i=e.target.id;if(i=='q'){S.q=e.target.value;drawGrid()}if(i=='note')S.note=e.target.value;if(i=='addr')S.addr=e.target.value;if(i=='ins')S.ins=e.target.value;if(i=='cph')S.cph=e.target.value});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='cmsg'){e.preventDefault();A.csend()}if(e.key=='Enter'&&e.target.id=='lsearch'){e.preventDefault();A.lsearch()}});
document.addEventListener('submit',e=>{e.preventDefault();A.go()});
setInterval(cpoll,10000);setInterval(()=>{if(S.user&&S.tab=='contact')chatRefresh()},4000);setInterval(async()=>{if(S.user&&S.tab=='menu'&&!document.body.classList.contains('lock')){try{S.prods=await api('c/menu');drawGrid()}catch{}}},30000);boot();
</script></body></html>
