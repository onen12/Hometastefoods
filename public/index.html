<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>POS</title><link rel="stylesheet" href="/style.css"></head>
<body><div id="root"></div><div id="rcpt"></div><div id="toast"></div>
<script src="/common.js"></script>
<script>
const S={tok:localStorage.tok||'',user:JSON.parse(localStorage.user||'null'),view:'pos',prods:[],cats:[],cfg:{},cart:{},cat:'All',q:'',cust:'',table:'',type:'dine_in',tab:'active',orders:[],seen:null,key:'',nOn:0};
const getTok=()=>S.tok,onAuthFail=()=>A.out();
const logo=c=>`<img class="logo ${c||''}" src="${S.cfg.logo?'/img/'+S.cfg.logo:'/logo.svg'}" alt="logo">`;
const fee=q=>S.type=='takeaway'?(+S.cfg.packing||0)*q:0;
const NAV=[['pos','utensils','New order'],['orders','receipt','Orders'],['stock','toggle','Availability','admin'],['menu','grid','Menu','admin'],['reports','chart','Reports','admin'],['staff','users','Staff','admin'],['settings','sliders','Settings','admin'],['profile','user','My profile']];
const LOGIN=()=>`<div class=auth><div class=ah>${logo()}<h1>${esc(S.cfg.name)}</h1><p>Your restaurant, one screen away. Take orders, run the kitchen and watch sales in real time.</p><ul><li>${ic('receipt')}Fast order taking</li><li>${ic('chef')}Live kitchen status</li><li>${ic('chart')}Daily sales reports</li></ul></div><div class=af><form><h2>Staff sign in</h2><small>Welcome back. Enter your details to continue.</small><div class=fld>${ic('user',18)}<input id=em type=email placeholder="Email address" autocomplete=username required></div><div class=fld>${ic('lock',18)}<input id=pw type=password placeholder="Password" autocomplete=current-password required></div><button class="btn big">Sign in</button><small>Customer? <a href=/order>Order food here</a></small></form></div></div>`;
function shell(){document.title=(S.cfg.name||'')+' POS';$('#root').innerHTML=S.user?`<div class=app><div class=scrim data-a=nvx></div><nav><div class=nb>${logo()}<div><b>${esc(S.cfg.name)}</b><small>${S.user.role=='admin'?'Administrator':'Cashier'}</small></div></div>${NAV.filter(n=>!n[3]||n[3]==S.user.role).map(n=>`<button data-a=nav data-v=${n[0]} id=n-${n[0]}>${ic(n[1])}<span>${n[2]}</span>${n[0]=='orders'?'<i class=bdg></i>':''}</button>`).join('')}<div class=sp></div><button data-a=out>${ic('logout')}<span>Sign out</span></button></nav><div class=mw><header class=tb><button class=ib data-a=nvo>${ic('menu',24)}</button><b id=ttl></b><span class=sp></span><button class=ib data-a=nav data-v=orders>${ic('bell',22)}<i class=bdg></i></button></header><main id=main></main></div></div><button class=cbar id=cbar data-a=copen></button>`:LOGIN();if(S.user)show()}
function show(){document.body.classList.remove('nv','lock');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.id=='n-'+S.view));const n=NAV.find(x=>x[0]==S.view);$('#ttl').textContent=n?n[2]:'';setDot();$('#cbar').innerHTML='';views[S.view]()}
const setDot=()=>document.querySelectorAll('.bdg').forEach(d=>d.textContent=S.nOn||'');
const boot=run(async()=>{S.cfg=await api('settings');if(S.user){[S.prods,S.cats]=await Promise.all([api('products'),api('categories')]);poll()}shell()});
const reload=async()=>{[S.prods,S.cats]=await Promise.all([api('products'),api('categories')]);show()};
const onProfile=run(async()=>{Object.assign(S.user,await api('me'));localStorage.user=JSON.stringify(S.user);shell()});
async function poll(){if(!S.user)return;try{const os=await api('orders'),on=os.filter(o=>o.source=='online'&&o.stage=='received'&&o.status!='cancelled'),nw=S.seen?on.filter(o=>!S.seen.has(o.id)):[],key=os.map(o=>o.id+o.status+o.stage).join();
 S.seen=new Set(on.map(o=>o.id));S.nOn=on.length;setDot();
 if(nw.length){beep();toast(`New order #${nw[0].id} from ${nw[0].customer}`)}
 if(key!=S.key){S.key=key;if(S.view=='orders')views.orders()}}catch{}}
const rcpt=o=>{const t=o.order_type=='takeaway';$('#rcpt').innerHTML=`<div class=c>${logo()}<h2>${esc(S.cfg.name)}</h2>${esc(S.cfg.address)}<br>${esc(S.cfg.phones)}</div><hr>Order #${o.id} · ${t?'TAKE AWAY':'DINE IN'}<br>${new Date(o.created_at).toLocaleString()}<br>${esc(o.customer)}${o.table_no?'<br>'+(t?'Note: ':'Table ')+esc(o.table_no):''}<hr>${(o.items||[]).map(i=>`<div>${esc(i.name)}</div><div class=ln><span>${i.qty} x ${Number(i.price).toLocaleString()}</span><span>${(i.price*i.qty).toLocaleString()}</span></div>`).join('')}${o.packing?`<div class=ln><span>Packing</span><span>${o.packing.toLocaleString()}</span></div>`:''}<hr><div class="ln b"><span>TOTAL UGX</span><span>${Math.round(o.total).toLocaleString()}</span></div>${o.status=='paid'?'PAID - '+(PMN[o.method]||''):'NOT PAID'}<hr><div class=c>Thank you!<br>Come again</div>`;setTimeout(()=>window.print(),500)};
function drawGrid(){$('#grid').innerHTML=S.prods.filter(p=>p.active&&(S.cat=='All'||p.category==S.cat)&&p.name.toLowerCase().includes(S.q.toLowerCase())).map(p=>tile(p,S.cart[p.id]||0)).join('')||'<p class=empty>No items</p>'}
function drawPos(){$('#cats').innerHTML=[{name:'All',all:1},...S.cats].map(c=>`<button class="cat ${c.name==S.cat?'on':''}" data-a=cat data-v="${esc(c.name)}">${c.all?`<div class="pic ph round">${ic('grid',26)}</div>`:pic(c.image_id,'utensils','round')}<span>${esc(c.name)}</span></button>`).join('');drawGrid()}
function drawCart(){const L=Object.entries(S.cart).map(([id,q])=>({p:S.prods.find(x=>x.id==id),q})).filter(x=>x.p),Q=L.reduce((s,x)=>s+x.q,0),sub=L.reduce((s,x)=>s+x.p.price*x.q,0),F=fee(Q),T=sub+F,d=S.type=='dine_in',off=L.length?'':'disabled';
$('#cart').innerHTML=`<div class=sh-head><button class=ib data-a=cclose>${ic('x',22)}</button><h3>Current order</h3></div><div class=sec><div class=opts style="margin:0"><button class="opt ${d?'on':''}" data-a=type data-v=dine_in>${ic('utensils',22)}<b>Dine in</b></button><button class="opt ${d?'':'on'}" data-a=type data-v=takeaway>${ic('bag',22)}<b>Take away</b></button></div><div class=two><input id=cust placeholder="Customer (optional)" value="${esc(S.cust)}"><input id=table placeholder="${d?'Table':'Note'}" value="${esc(S.table)}"></div></div><div class=sec>${L.map(x=>`<div class=ln2>${pic(x.p.image_id,'utensils','sq')}<div class=g><b>${esc(x.p.name)}</b><small>${fmt(x.p.price)}</small></div><div class=qs><button data-a=dec data-v=${x.p.id}>${ic('minus',16)}</button><b>${x.q}</b><button data-a=add data-v=${x.p.id}>${ic('plus',16)}</button></div></div>`).join('')||'<p class=empty>Tap a dish to add it</p>'}</div><div class=sec><div class=sum><div><span>Subtotal</span><span>${fmt(sub)}</span></div>${F?`<div><span>Packing (${Q} plate${Q>1?'s':''})</span><span>${fmt(F)}</span></div>`:''}<div class=t><span>Total</span><span>${fmt(T)}</span></div></div></div><div class=foot><div class=lbl>Take payment</div><div class=payrow><button class="pb cash" ${off} data-a=pay data-v=cash>${ic('cash',22)}Cash</button><button class="pb mtn" ${off} data-a=pay data-v=mtn>${ic('mobile',22)}MTN MoMo</button><button class="pb airtel" ${off} data-a=pay data-v=airtel>${ic('mobile',22)}Airtel Money</button></div><button class="btn ghost" ${off} data-a=pay data-v=hold>Save as open order</button></div>`;
const b=$('#cbar');if(b)b.innerHTML=Q?`<span class=cl>${ic('bag',20)}<b>${Q}</b></span><span>View order</span><span>${fmt(T)}</span>`:''}
const NXT={received:['preparing','Start preparing'],preparing:['ready','Mark as ready'],ready:['delivering','Out for delivery'],delivering:['done','Complete order']},PRV={preparing:'received',ready:'preparing',delivering:'ready',done:'delivering'};
const ocard=o=>{const nw=o.source=='online'&&o.stage=='received'&&o.status!='cancelled',t=o.order_type=='takeaway',x=o.status=='cancelled',i=Math.max(0,STG.findIndex(s=>s[0]==o.stage)),n=NXT[o.stage],un=o.status=='open';
return`<div class="card oc ${nw?'new':''}">${nw?`<span class=newb>${ic('bell',13)} New order</span>`:''}<div class=row><div><b>#${o.id} · ${esc(o.customer)}</b><br><small>${new Date(o.created_at).toLocaleString([],{dateStyle:'short',timeStyle:'short'})} · ${esc(o.cashier||o.phone||'')}</small></div><div class=row><span class="badge ${o.status}">${{open:'Unpaid',paid:'Paid',cancelled:'Cancelled'}[o.status]}</span><button class=ib data-a=print data-v=${o.id}>${ic('printer',18)}</button></div></div>
<div class=tags><span class=tag>${ic(t?'bag':'utensils',13)} ${t?'Take away':'Dine in'}</span>${o.table_no?`<span class=tag>${esc(o.table_no)}</span>`:''}${o.source=='online'?`<span class="tag hot">${ic('globe',13)} Online</span>`:''}${o.status=='paid'?`<span class=tag>${PMN[o.method]||''}</span>`:''}</div>
<ul class=its>${(o.items||[]).map(i=>`<li>${i.qty} × ${esc(i.name)}</li>`).join('')}</ul>${o.packing?`<small>Packing ${fmt(o.packing)}</small>`:''}<div class=amtr><span>Total</span><span>${fmt(o.total)}</span></div>
${x?'':`<div class=prog>${STG.map((s,j)=>`<i class="${j<=i?'on':''}"></i>`).join('')}</div><div class=pl2><span>${ic(STG[i][1],16)} ${STG[i][2]}</span><small>Step ${i+1} of 5</small></div>${n?`<button class=btn data-a=stage data-v="${o.id}:${n[0]}">${n[1]} ${ic('right',18)}</button>`:''}${PRV[o.stage]?`<button class=lnk data-a=stage data-v="${o.id}:${PRV[o.stage]}">Undo, go back one step</button>`:''}`}
${un?`<div class=payblk><small>${o.source=='online'?`Customer chose ${PMN[o.pay_pref]||'Cash'}. Confirm once you have received the money.`:'Waiting for payment.'}</small><div class=payrow><button class="pb cash" data-a=opay data-v="${o.id}:cash">${ic('cash',20)}Cash</button><button class="pb mtn" data-a=opay data-v="${o.id}:mtn">${ic('mobile',20)}MTN</button><button class="pb airtel" data-a=opay data-v="${o.id}:airtel">${ic('mobile',20)}Airtel</button></div><button class=lnk data-a=ocancel data-v=${o.id}>Cancel this order</button></div>`:''}</div>`};
const co=sel=>S.cats.map(c=>`<option ${c.name==sel?'selected':''}>${esc(c.name)}</option>`).join('');
const rowVals=id=>[...document.querySelector(`.item[data-id="${id}"]`).querySelectorAll('input,select')].map(i=>i.value);
const views={
pos(){$('#main').innerHTML=`<div class=pos><section><div><h2>${greet()}, ${esc(S.user.name.split(' ')[0])}</h2><small>Tap dishes to build an order</small></div><div class=sb>${ic('search',20)}<input id=q placeholder="Search dishes" value="${esc(S.q)}"></div><div class=cats id=cats></div><div class=grid id=grid></div></section><aside class=cart id=cart></aside></div>`;drawPos();drawCart()},
orders:run(async()=>{const all=S.orders=await api('orders'),F={active:o=>o.status!='cancelled'&&o.stage!='done',open:o=>o.status=='open',paid:o=>o.status=='paid','':()=>true},os=all.filter(F[S.tab]||F.active);$('#main').innerHTML=`<div class=pg><h2 style="margin-top:0">Orders</h2><div class=chips>${[['active','Active'],['open','Unpaid'],['paid','Paid'],['','All']].map(([v,l])=>`<button class="chip ${S.tab==v?'on':''}" data-a=tab data-v="${v}">${l}</button>`).join('')}</div><div class=ocards>${os.map(ocard).join('')||'<p class=empty>No orders here</p>'}</div></div>`}),
stock(){$('#main').innerHTML=`<div class=pg><h2 style="margin-top:0">Today's availability</h2><small>Switch dishes on or off and set the plates you have. Leave plates empty for unlimited.</small><div class=avl>${S.prods.map(p=>`<div class="card av ${soldout(p)?'off':''}">${pic(p.image_id,'utensils','round sm')}<div><b>${esc(p.name)}</b><br><small>${soldout(p)?'Sold out':p.stock==null?'Unlimited plates':p.stock+' plates left'}</small></div><button class="swt ${p.available?'on':''}" data-a=avt data-v=${p.id}><i></i></button><div class=plw><input class=pl type=number min=0 placeholder="Plates" value="${p.stock??''}" data-pl=${p.id}><button class=sm data-a=avsave data-v=${p.id}>Set</button></div></div>`).join('')}</div></div>`},
menu(){$('#main').innerHTML=`<div class=pg><h2 style="margin-top:0">Categories</h2><div class="card addp" style="grid-template-columns:1fr auto"><input id=ncn placeholder="New category name"><button class=btn data-a=cadd>${ic('plus',18)} Add</button></div><div class=catcards>${S.cats.map(c=>`<div class=card><div class=ipic data-a=cpic data-v=${c.id}>${pic(c.image_id,'utensils','round')}<span>${ic('camera',14)}</span></div><b>${esc(c.name)}</b><button class="sm danger" data-a=cdel data-v=${c.id}>${ic('trash',15)} Remove</button></div>`).join('')}</div><h2>Menu items</h2><div class="card addp"><input id=np placeholder="Item name"><select id=nc>${co()}</select><input id=nr type=number placeholder="Price (UGX)"><button class=btn data-a=padd>${ic('plus',18)} Add item</button></div><div class=items>${S.prods.map(p=>`<div class="card item" data-id=${p.id}><div class=ipic data-a=ppic data-v=${p.id}>${pic(p.image_id)}<span>${ic('camera',14)}</span></div><input value="${esc(p.name)}"><select>${co(p.category)}</select><input type=number value=${p.price}><div class=acts><button class=sm data-a=psave data-v=${p.id}>${ic('check',15)} Save</button><button class="sm danger" data-a=pdel data-v=${p.id}>${ic('trash',15)}</button></div></div>`).join('')}</div></div>`},
reports:run(async()=>{const d=await api('reports'),m=k=>(d.methods.find(x=>x.method==k)||{sum:0}).sum,mx=Math.max(1,...d.week.map(w=>w.sum));$('#main').innerHTML=`<div class=pg><h2 style="margin-top:0">Today</h2><div class=stats>${[['Sales today',fmt(d.today.sum)],['Paid orders',d.today.n],['Cash',fmt(m('cash'))],['MTN MoMo',fmt(m('mtn'))],['Airtel Money',fmt(m('airtel'))]].map(([a,b])=>`<div class=card><small>${a}</small><h3>${b}</h3></div>`).join('')}</div><div class=two2><div class=card><h3 style="margin-bottom:14px">Last 7 days</h3><div class=bars>${d.week.map(w=>`<div class=bar><small>${w.sum?Math.round(w.sum/1000)+'k':''}</small><i style="height:${w.sum/mx*85}%"></i><small>${w.day}</small></div>`).join('')}</div></div><div class=card><h3 style="margin-bottom:10px">Top dishes (30 days)</h3>${d.top.map((t,i)=>`<div class=row style="padding:6px 0"><span>${i+1}. ${esc(t.name)}</span><b>${t.qty}</b></div>`).join('')||'<p class=empty>No sales yet</p>'}</div></div></div>`}),
staff:run(async()=>{const us=await api('users');$('#main').innerHTML=`<div class=pg><h2 style="margin-top:0">Staff</h2><div class="card addp"><input id=un placeholder="Full name"><input id=ue type=email placeholder="Email"><input id=up type=password placeholder="Password (8+)"><select id=ur><option value=cashier>Cashier</option><option value=admin>Admin</option></select></div><button class=btn data-a=uadd>${ic('plus',18)} Add staff member</button><div class=card>${us.map(u=>`<div class=row style="padding:8px 0"><span class=row style="justify-content:flex-start">${pic(u.avatar_id,'user','round sm')}<span><b>${esc(u.name)}</b><br><small>${esc(u.email)}</small></span></span><span class=row><span class=badge>${u.role}</span>${u.id==S.user.id?'':`<button class="sm danger" data-a=udel data-v=${u.id}>${ic('trash',15)}</button>`}</span></div>`).join('')}</div></div>`}),
settings(){const c=S.cfg,f=(i,l,v,t)=>`<label>${l}</label><input id=${i} ${t||''} value="${esc(v)}">`;$('#main').innerHTML=`<div class=pg><div class="card prof"><div class=ipic data-a=logopic style="width:auto">${logo('big')}<span>${ic('camera',14)}</span></div><h3 style="margin-top:6px">Business settings</h3>${f('sn','Business name',c.name)}${f('sa','Address',c.address)}${f('sp','Phone numbers',c.phones)}${f('sm','MTN merchant code',c.mtn)}${f('sl','Airtel merchant code',c.airtel)}${f('sf','Take-away packing fee (UGX per plate)',c.packing,'type=number')}<label>When a dish is sold out</label><select id=sh><option value=0>Show it as Sold out</option><option value=1 ${c.hide_soldout=='1'?'selected':''}>Hide it from customers</option></select><button class=btn style="margin-top:16px" data-a=ssave>Save settings</button></div></div>`},
profile:run(async()=>profileView('me',$('#main')))};
Object.assign(A,{
nav:v=>{S.view=v;show()},out:()=>{localStorage.removeItem('tok');localStorage.removeItem('user');S.tok='';S.user=null;S.cart={};S.seen=null;shell()},
cat:v=>{S.cat=v;drawPos()},
add:v=>{const p=S.prods.find(x=>x.id==v);if(soldout(p))return toast('Sold out');if(p.stock!=null&&(S.cart[v]||0)>=p.stock)return toast(`Only ${p.stock} plate(s) left`);S.cart[v]=(S.cart[v]||0)+1;drawGrid();drawCart()},
dec:v=>{if(--S.cart[v]<=0)delete S.cart[v];drawGrid();drawCart()},type:v=>{S.type=v;drawCart()},
pay:run(async m=>{const o=await api('orders','POST',{customer:S.cust,table:S.table,type:S.type,method:m=='hold'?null:m,items:Object.entries(S.cart).map(([id,qty])=>({id:+id,qty}))});S.cart={};S.cust=S.table='';A.cclose();drawGrid();drawCart();toast(o.status=='paid'?'Payment recorded':'Order saved');if(o.status=='paid')rcpt(o);poll()}),
tab:v=>{S.tab=v;views.orders()},
stage:run(async v=>{const[id,s]=v.split(':');await api(`orders/${id}/stage`,'POST',{stage:s});poll();views.orders()}),
avt:run(async v=>{const p=S.prods.find(x=>x.id==v);await api(`products/${v}/stock`,'PUT',{available:!p.available,stock:p.stock});await reload()}),
avsave:run(async v=>{const p=S.prods.find(x=>x.id==v);await api(`products/${v}/stock`,'PUT',{available:p.available,stock:document.querySelector(`[data-pl="${v}"]`).value});await reload();toast('Plates updated')}),
opay:run(async v=>{const[id,m]=v.split(':');await api(`orders/${id}/pay`,'POST',{method:m});toast('Payment recorded');poll();views.orders()}),
ocancel:run(async v=>{if(confirm('Cancel this order?')){await api(`orders/${v}/cancel`,'POST');poll();views.orders()}}),
print:v=>rcpt(S.orders.find(o=>o.id==v)),
cadd:run(async()=>{await api('categories','POST',{name:$('#ncn').value});await reload();toast('Category added')}),
cpic:v=>pick(async id=>{await api('categories/'+v,'PUT',{image_id:id});await reload();toast('Photo updated')},{max:300}),
cdel:run(async v=>{if(confirm('Remove this category?')){await api('categories/'+v,'DELETE');await reload()}}),
padd:run(async()=>{await api('products','POST',{name:$('#np').value,category:$('#nc').value,price:$('#nr').value});await reload();toast('Item added')}),
psave:run(async v=>{const[n,c,p]=rowVals(v);await api('products/'+v,'PUT',{...S.prods.find(x=>x.id==v),name:n,category:c,price:p});await reload();toast('Saved')}),
ppic:v=>pick(async id=>{await api('products/'+v,'PUT',{...S.prods.find(x=>x.id==v),image_id:id});await reload();toast('Photo updated')}),
pdel:run(async v=>{if(confirm('Delete this item? Past orders keep their records.')){await api('products/'+v,'DELETE');delete S.cart[v];await reload()}}),
uadd:run(async()=>{await api('users','POST',{name:$('#un').value,email:$('#ue').value,password:$('#up').value,role:$('#ur').value});toast('Staff added');views.staff()}),
udel:run(async v=>{if(confirm('Remove this staff member?')){await api('users/'+v,'DELETE');views.staff()}}),
logopic:()=>pick(async id=>{S.cfg=await api('settings','PUT',{logo:id});shell();toast('Logo updated')},{max:500,png:true}),
ssave:run(async()=>{S.cfg=await api('settings','PUT',{name:$('#sn').value,address:$('#sa').value,phones:$('#sp').value,mtn:$('#sm').value,airtel:$('#sl').value,packing:$('#sf').value,hide_soldout:$('#sh').value});shell();toast('Settings saved')})});
document.addEventListener('input',e=>{const i=e.target.id;if(i=='q'){S.q=e.target.value;drawGrid()}if(i=='cust')S.cust=e.target.value;if(i=='table')S.table=e.target.value});
document.addEventListener('submit',run(async e=>{e.preventDefault();const j=await api('login','POST',{email:$('#em').value,password:$('#pw').value});S.tok=localStorage.tok=j.token;S.user=j.user;localStorage.user=JSON.stringify(j.user);S.view='pos';S.seen=null;boot()}));
setInterval(poll,10000);boot();
</script></body></html>
