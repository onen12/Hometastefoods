<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POS</title><link rel="stylesheet" href="/style.css"></head>
<body><div id="root"></div><div id="rcpt"></div><div id="toast"></div>
<script src="/common.js"></script>
<script>
const S={tok:localStorage.tok||'',user:JSON.parse(localStorage.user||'null'),view:'pos',prods:[],cats:[],cfg:{},cart:{},cat:'All',q:'',cust:'',table:'',type:'dine_in',tab:'active',orders:[],seen:null,key:'',nOn:0};
const getTok=()=>S.tok,onAuthFail=()=>A.out();
const logo=c=>`<img class="logo ${c||''}" src="${S.cfg.logo?'/img/'+S.cfg.logo:'/logo.svg'}" alt="logo">`;
const fee=q=>S.type=='takeaway'?(+S.cfg.packing||0)*q:0;
const NAV=[['pos','🍽️','New order'],['orders','🧾','Orders'],['stock','🥘','Availability','admin'],['menu','📋','Menu','admin'],['reports','📊','Reports','admin'],['staff','👥','Staff','admin'],['settings','⚙️','Settings','admin'],['profile','🙍','My profile']];
const LOGIN=()=>`<form class=login>${logo()}<h1>${esc(S.cfg.name)}</h1><p>Staff sign in</p><input id=em type=email placeholder=Email required><input id=pw type=password placeholder=Password required><button class=btn>Sign in</button><small><a href=/order>Customer ordering page →</a></small></form>`;
function shell(){document.title=(S.cfg.name||'')+' POS';$('#root').innerHTML=S.user?`<div class=app><nav><div style="padding:0 6px 6px">${logo()}</div><div class=brand>${pic(S.user.avatar_id,'👤','round sm')}<div>${esc(S.user.name)}<small>${S.user.role}</small></div></div>${NAV.filter(n=>!n[3]||n[3]==S.user.role).map(n=>`<button data-a=nav data-v=${n[0]} id=n-${n[0]}>${n[1]} ${n[2]}${n[0]=='orders'?'<i class=dot id=dot></i>':''}</button>`).join('')}<div class=sp></div><button data-a=out>🚪 Sign out</button></nav><main id=main></main></div>`:LOGIN();if(S.user)show()}
function show(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.id=='n-'+S.view));setDot();views[S.view]()}
const setDot=()=>{const d=$('#dot');if(d)d.textContent=S.nOn||''};
const boot=run(async()=>{S.cfg=await api('settings');if(S.user){[S.prods,S.cats]=await Promise.all([api('products'),api('categories')]);poll()}shell()});
const reload=async()=>{[S.prods,S.cats]=await Promise.all([api('products'),api('categories')]);show()};
const onProfile=run(async()=>{Object.assign(S.user,await api('me'));localStorage.user=JSON.stringify(S.user);shell()});
async function poll(){if(!S.user)return;try{const os=await api('orders'),on=os.filter(o=>o.source=='online'&&o.stage=='received'&&o.status!='cancelled'),nw=S.seen?on.filter(o=>!S.seen.has(o.id)):[],key=os.map(o=>o.id+o.status+o.stage).join();
 S.seen=new Set(on.map(o=>o.id));S.nOn=on.length;setDot();
 if(nw.length){beep();toast(`🔔 New order #${nw[0].id} from ${nw[0].customer}`)}
 if(key!=S.key){S.key=key;if(S.view=='orders')views.orders()}}catch{}}
const rcpt=o=>{const t=o.order_type=='takeaway';$('#rcpt').innerHTML=`<div class=c>${logo()}<h2>${esc(S.cfg.name)}</h2>${esc(S.cfg.address)}<br>${esc(S.cfg.phones)}</div><hr>Order #${o.id} · ${t?'TAKE AWAY':'DINE IN'}<br>${new Date(o.created_at).toLocaleString()}<br>${esc(o.customer)}${o.table_no?'<br>'+(t?'Note: ':'Table ')+esc(o.table_no):''}<hr>${(o.items||[]).map(i=>`<div>${esc(i.name)}</div><div class=ln><span>${i.qty} x ${Number(i.price).toLocaleString()}</span><span>${(i.price*i.qty).toLocaleString()}</span></div>`).join('')}${o.packing?`<div class=ln><span>Packing</span><span>${o.packing.toLocaleString()}</span></div>`:''}<hr><div class="ln b"><span>TOTAL UGX</span><span>${Math.round(o.total).toLocaleString()}</span></div>${o.status=='paid'?'PAID - '+(PMN[o.method]||''):'NOT PAID'}<hr><div class=c>Thank you!<br>Come again</div>`;setTimeout(()=>window.print(),500)};
function drawPos(){const act=S.prods.filter(p=>p.active);
$('#cats').innerHTML=[{name:'All'},...S.cats].map(c=>`<button class="cat ${c.name==S.cat?'on':''}" data-a=cat data-v="${esc(c.name)}">${pic(c.image_id,'🍴','round')}${esc(c.name)}</button>`).join('');
$('#grid').innerHTML=act.filter(p=>(S.cat=='All'||p.category==S.cat)&&p.name.toLowerCase().includes(S.q.toLowerCase())).map(tile).join('')||'<p class=empty>No items</p>'}
function drawCart(){const L=Object.entries(S.cart).map(([id,q])=>({p:S.prods.find(x=>x.id==id),q})).filter(x=>x.p),Q=L.reduce((s,x)=>s+x.q,0),T=L.reduce((s,x)=>s+x.p.price*x.q,0)+fee(Q),d=S.type=='dine_in';
$('#cart').innerHTML=`<h3>Current order</h3><div class=seg><button class="${d?'on':''}" data-a=type data-v=dine_in>🍽️ Dine in</button><button class="${d?'':'on'}" data-a=type data-v=takeaway>🥡 Take away</button></div><div class=two><input id=cust placeholder="Customer (optional)" value="${esc(S.cust)}"><input id=table placeholder="${d?'Table':'Note'}" value="${esc(S.table)}"></div>${L.map(x=>`<div class=line><div><b>${esc(x.p.name)}</b><br><small>${fmt(x.p.price)}</small></div><div class=qty><button data-a=dec data-v=${x.p.id}>−</button><b>${x.q}</b><button data-a=add data-v=${x.p.id}>+</button></div></div>`).join('')||'<p class=empty>Tap a menu item to add it</p>'}${fee(Q)?`<div class=row><small>🥡 Packing · ${Q} plate${Q>1?'s':''}</small><small>${fmt(fee(Q))}</small></div>`:''}<div class=tot><span>Total</span><b>${fmt(T)}</b></div><div class=pay><button class="btn cash" data-a=pay data-v=cash>💵 Cash</button><button class="btn mtn" data-a=pay data-v=mtn>MTN MoMo</button><button class="btn airtel" data-a=pay data-v=airtel>Airtel</button></div><button class="btn ghost" data-a=pay data-v=hold>Save as open order</button>${L.length?'<button class="btn link" data-a=clear>Clear order</button>':''}`}
const ocard=o=>{const nw=o.source=='online'&&o.stage=='received'&&o.status!='cancelled',t=o.order_type=='takeaway',x=o.status=='cancelled';return`<div class="card oc ${nw?'new':''}">${nw?'<span class=ribbon>🔔 NEW ORDER</span>':''}<div class=row><b>#${o.id} ${esc(o.customer)}</b><span class="badge ${o.status}">${o.status}</span></div><div class=tags><span class=tag>${t?'🥡 Take away':'🍽️ Dine in'}</span>${o.table_no?`<span class=tag>${esc(o.table_no)}</span>`:''}${o.source=='online'?'<span class="tag hot">🌐 Online</span>':''}${o.status=='paid'?`<span class=tag>${PMN[o.method]||''}</span>`:''}</div><small>${new Date(o.created_at).toLocaleString()} · ${esc(o.cashier||o.phone||'')}</small>${o.source=='online'&&o.status=='open'?`<div class=info>📞 ${esc(o.phone)} · pays by <b>${PMN[o.pay_pref]||'Cash'}</b>. Confirm once you have received it.</div>`:''}<ul>${(o.items||[]).map(i=>`<li>${i.qty} × ${esc(i.name)}</li>`).join('')}</ul>${o.packing?`<small>Packing ${fmt(o.packing)}</small>`:''}${x?'':`<div class=stg>${STG.map(([k,e,l])=>`<button class="stp ${o.stage==k?'on':''}" data-a=stage data-v="${o.id}:${k}">${e} ${l}</button>`).join('')}</div>`}<div class=row><b class=amt>${fmt(o.total)}</b><div class=acts>${o.status=='open'?['cash','mtn','airtel'].map(m=>`<button class="sm ${m}" data-a=opay data-v="${o.id}:${m}">${PMN[m]}</button>`).join('')+`<button class="sm ghost" data-a=ocancel data-v=${o.id}>Cancel</button>`:''}<button class="sm ghost" data-a=print data-v=${o.id}>🖨️</button></div></div></div>`};
const co=sel=>S.cats.map(c=>`<option ${c.name==sel?'selected':''}>${esc(c.name)}</option>`).join('');
const rowVals=id=>[...document.querySelector(`.item[data-id="${id}"]`).querySelectorAll('input,select')].map(i=>i.value);
const views={
pos(){$('#main').innerHTML=`<div class=pos><section><h2>${greet()}, ${esc(S.user.name.split(' ')[0])} 👋</h2><input id=q placeholder="Search menu…" value="${esc(S.q)}"><div class=cats id=cats></div><div class=grid id=grid></div></section><aside class=cart id=cart></aside></div>`;drawPos();drawCart()},
orders:run(async()=>{const all=S.orders=await api('orders'),F={active:o=>o.status!='cancelled'&&o.stage!='done',open:o=>o.status=='open',paid:o=>o.status=='paid','':()=>true},os=all.filter(F[S.tab]||F.active);$('#main').innerHTML=`<h2>Orders</h2><div class=chips>${[['active','🔥 Active'],['open','Unpaid'],['paid','Paid'],['','All']].map(([v,l])=>`<button class="chip ${S.tab==v?'on':''}" data-a=tab data-v="${v}">${l}</button>`).join('')}</div><div class=ocards>${os.map(ocard).join('')||'<p class=empty>No orders here</p>'}</div>`}),
menu(){$('#main').innerHTML=`<h2>Categories</h2><div class="card addp" style="grid-template-columns:1fr auto"><input id=ncn placeholder="New category name"><button class=btn data-a=cadd>Add category</button></div><div class=catcards>${S.cats.map(c=>`<div class=card><div class=ipic data-a=cpic data-v=${c.id}>${pic(c.image_id,'🍴','round')}<span>📷</span></div><b>${esc(c.name)}</b><button class="sm ghost" data-a=cdel data-v=${c.id}>Remove</button></div>`).join('')}</div><h2>Menu items</h2><div class="card addp"><input id=np placeholder="Item name"><select id=nc>${co()}</select><input id=nr type=number placeholder="Price UGX"><button class=btn data-a=padd>Add item</button></div><div class=items>${S.prods.map(p=>`<div class="card item ${p.active?'':'off'}" data-id=${p.id}><div class=ipic data-a=ppic data-v=${p.id}>${pic(p.image_id)}<span>📷 Photo</span></div><input value="${esc(p.name)}"><select>${co(p.category)}</select><input type=number value=${p.price}><div class=acts><button class=sm data-a=psave data-v=${p.id}>Save</button><button class="sm ghost" data-a=pdel data-v=${p.id}>✕</button></div></div>`).join('')}</div>`},
stock(){$('#main').innerHTML=`<h2>Today's availability</h2><p><small>Switch dishes on or off and set how many plates are ready. Leave plates empty for unlimited. Customers see changes straight away.</small></p><div class=avl>${S.prods.map(p=>`<div class="card av ${soldout(p)?'off':''}">${pic(p.image_id,'🍽️','round')}<div><b>${esc(p.name)}</b><br><small>${esc(p.category)} · ${soldout(p)?'Sold out':p.stock==null?'Unlimited':p.stock+' plates left'}</small></div><button class="swt ${p.available?'on':''}" data-a=avt data-v=${p.id}><i></i></button><input class=pl type=number min=0 placeholder="∞" value="${p.stock??''}" data-pl=${p.id}><button class=sm data-a=avsave data-v=${p.id}>Set plates</button></div>`).join('')}</div>`},
reports:run(async()=>{const d=await api('reports'),m=k=>(d.methods.find(x=>x.method==k)||{sum:0}).sum,mx=Math.max(1,...d.week.map(w=>w.sum));$('#main').innerHTML=`<h2>Today</h2><div class=stats>${[['Sales today',fmt(d.today.sum)],['Paid orders',d.today.n],['Cash',fmt(m('cash'))],['MTN MoMo',fmt(m('mtn'))],['Airtel Money',fmt(m('airtel'))]].map(([a,b])=>`<div class=card><small>${a}</small><h3>${b}</h3></div>`).join('')}</div><div class=two2><div class=card><h3>Last 7 days</h3><div class=bars>${d.week.map(w=>`<div class=bar><small>${w.sum?Math.round(w.sum/1000)+'k':''}</small><i style="height:${w.sum/mx*85}%"></i><small>${w.day}</small></div>`).join('')}</div></div><div class=card><h3>Top items (30 days)</h3>${d.top.map((t,i)=>`<div class=row><span>${i+1}. ${esc(t.name)}</span><b>${t.qty}</b></div>`).join('')||'<p class=empty>No sales yet</p>'}</div></div>`}),
staff:run(async()=>{const us=await api('users');$('#main').innerHTML=`<h2>Staff</h2><div class="card addp"><input id=un placeholder="Full name"><input id=ue type=email placeholder="Email"><input id=up type=password placeholder="Password (8+)"><select id=ur><option value=cashier>Cashier</option><option value=admin>Admin</option></select></div><button class="btn" style="margin:10px 0 16px" data-a=uadd>Add staff member</button><div class=card>${us.map(u=>`<div class=row><span class=acts style="align-items:center">${pic(u.avatar_id,'👤','round sm')}<span><b>${esc(u.name)}</b><br><small>${esc(u.email)}</small></span></span><span class=acts><span class=badge>${u.role}</span>${u.id==S.user.id?'':`<button class="sm ghost" data-a=udel data-v=${u.id}>Remove</button>`}</span></div>`).join('')}</div>`}),
settings(){const c=S.cfg,f=(i,l,v,t)=>`<label>${l}</label><input id=${i} ${t||''} value="${esc(v)}">`;$('#main').innerHTML=`<h2>Settings</h2><div class="card prof"><div class=ipic data-a=logopic>${logo('big')}<span>📷 Change logo</span></div>${f('sn','Business name',c.name)}${f('sa','Address',c.address)}${f('sp','Phone numbers',c.phones)}${f('sm','MTN merchant code',c.mtn)}${f('sl','Airtel merchant code',c.airtel)}${f('sf','Take-away packing fee (UGX per plate)',c.packing,'type=number')}<label>When a dish is sold out</label><select id=sh><option value=0>Show it as Sold out</option><option value=1 ${c.hide_soldout=='1'?'selected':''}>Hide it from customers</option></select><button class=btn data-a=ssave>Save settings</button></div>`},
profile:run(async()=>profileView('me',$('#main')))};
Object.assign(A,{
nav:v=>{S.view=v;show()},out:()=>{localStorage.removeItem('tok');localStorage.removeItem('user');S.tok='';S.user=null;S.cart={};S.seen=null;shell()},
cat:v=>{S.cat=v;drawPos()},add:v=>{const p=S.prods.find(x=>x.id==v);if(soldout(p))return toast('Sold out');if(p.stock!=null&&(S.cart[v]||0)>=p.stock)return toast(`Only ${p.stock} plate(s) left`);S.cart[v]=(S.cart[v]||0)+1;drawCart()},dec:v=>{if(--S.cart[v]<=0)delete S.cart[v];drawCart()},clear:()=>{S.cart={};drawCart()},type:v=>{S.type=v;drawCart()},
pay:run(async m=>{const o=await api('orders','POST',{customer:S.cust,table:S.table,type:S.type,method:m=='hold'?null:m,items:Object.entries(S.cart).map(([id,qty])=>({id:+id,qty}))});S.cart={};S.cust=S.table='';drawCart();toast(o.status=='paid'?'Payment recorded ✓':'Order saved ✓');if(o.status=='paid')rcpt(o)}),
tab:v=>{S.tab=v;views.orders()},
opay:run(async v=>{const[id,m]=v.split(':');await api(`orders/${id}/pay`,'POST',{method:m});toast('Payment recorded ✓');poll();views.orders()}),
ocancel:run(async v=>{if(confirm('Cancel this order?')){await api(`orders/${v}/cancel`,'POST');poll();views.orders()}}),
print:v=>rcpt(S.orders.find(o=>o.id==v)),
cadd:run(async()=>{await api('categories','POST',{name:$('#ncn').value});await reload();toast('Category added ✓')}),
cpic:v=>pick(async id=>{await api('categories/'+v,'PUT',{image_id:id});await reload();toast('Photo updated ✓')},{max:300}),
cdel:run(async v=>{if(confirm('Remove this category?')){await api('categories/'+v,'DELETE');await reload()}}),
padd:run(async()=>{await api('products','POST',{name:$('#np').value,category:$('#nc').value,price:$('#nr').value});await reload();toast('Item added ✓')}),
psave:run(async v=>{const[n,c,p]=rowVals(v);await api('products/'+v,'PUT',{...S.prods.find(x=>x.id==v),name:n,category:c,price:p});await reload();toast('Saved ✓')}),
ppic:v=>pick(async id=>{await api('products/'+v,'PUT',{...S.prods.find(x=>x.id==v),image_id:id});await reload();toast('Photo updated ✓')}),
ptog:run(async v=>{const p=S.prods.find(x=>x.id==v);await api('products/'+v,'PUT',{...p,active:!p.active});await reload()}),
pdel:run(async v=>{if(confirm('Delete this item? Past orders keep their records.')){await api('products/'+v,'DELETE');delete S.cart[v];await reload()}}),
stage:run(async v=>{const[id,s]=v.split(':');await api(`orders/${id}/stage`,'POST',{stage:s});poll();views.orders()}),
avt:run(async v=>{const p=S.prods.find(x=>x.id==v);await api(`products/${v}/stock`,'PUT',{available:!p.available,stock:p.stock});await reload()}),
avsave:run(async v=>{const p=S.prods.find(x=>x.id==v);await api(`products/${v}/stock`,'PUT',{available:p.available,stock:document.querySelector(`[data-pl="${v}"]`).value});await reload();toast('Plates updated ✓')}),
uadd:run(async()=>{await api('users','POST',{name:$('#un').value,email:$('#ue').value,password:$('#up').value,role:$('#ur').value});toast('Staff added ✓');views.staff()}),
udel:run(async v=>{if(confirm('Remove this staff member?')){await api('users/'+v,'DELETE');views.staff()}}),
logopic:()=>pick(async id=>{S.cfg=await api('settings','PUT',{logo:id});shell();toast('Logo updated ✓')},{max:500,png:true}),
ssave:run(async()=>{S.cfg=await api('settings','PUT',{name:$('#sn').value,address:$('#sa').value,phones:$('#sp').value,mtn:$('#sm').value,airtel:$('#sl').value,packing:$('#sf').value,hide_soldout:$('#sh').value});shell();toast('Settings saved ✓')})});
document.addEventListener('input',e=>{const i=e.target.id;if(i=='q'){S.q=e.target.value;drawPos()}if(i=='cust')S.cust=e.target.value;if(i=='table')S.table=e.target.value});
document.addEventListener('submit',run(async e=>{e.preventDefault();const j=await api('login','POST',{email:$('#em').value,password:$('#pw').value});S.tok=localStorage.tok=j.token;S.user=j.user;localStorage.user=JSON.stringify(j.user);S.view='pos';S.seen=null;boot()}));
setInterval(poll,10000);boot();
</script></body></html>
