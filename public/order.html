<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order online</title><link rel="stylesheet" href="/style.css"></head>
<body><div id="root"></div><div id="toast"></div>
<script src="/common.js"></script>
<script>
const S={tok:localStorage.ctok||'',user:JSON.parse(localStorage.cuser||'null'),prods:[],cats:[],cfg:{},cart:{},cat:'All',q:'',mode:'in',tab:'menu',type:'dine_in',method:'cash',note:'',stages:{}};
const getTok=()=>S.tok,onAuthFail=()=>A.out();
const logo=()=>`<img class=logo src="${S.cfg.logo?'/img/'+S.cfg.logo:'/logo.svg'}" alt="logo">`;
const fee=q=>S.type=='takeaway'?(+S.cfg.packing||0)*q:0;
const ST=o=>o.status=='paid'?['Paid ✓','paid']:o.status=='cancelled'?['Cancelled','cancelled']:[o.pay_pref=='cash'?'Pay at the counter':'Payment being confirmed','open'];
const boot=run(async()=>{[S.cfg,S.cats,S.prods]=await Promise.all([api('settings'),api('categories'),api('c/menu')]);document.title='Order · '+S.cfg.name;render()});
const onProfile=run(async()=>{Object.assign(S.user,await api('c/me'));localStorage.cuser=JSON.stringify(S.user);render()});
function render(){
if(!S.user){$('#root').innerHTML=`<form class=login id=af>${logo()}<h1>${esc(S.cfg.name)}</h1><p>${S.mode=='in'?'Sign in to order 😋':'Create your account'}</p>${S.mode=='up'?'<input id=nm placeholder="Your name" required>':''}<input id=ph type=tel placeholder="Phone number" required><input id=pw type=password placeholder="Password (6+ characters)" required><button class=btn>${S.mode=='in'?'Sign in':'Create account'}</button><small>${S.mode=='in'?'New here? <a href=# data-a=mode data-v=up>Create an account</a>':'Have an account? <a href=# data-a=mode data-v=in>Sign in</a>'}</small></form>`;return}
$('#root').innerHTML=`<div class=top><span>${logo()}<b>${esc(S.cfg.name)}</b></span><span><button data-a=tab data-v=menu>🍽️ Menu</button><button data-a=tab data-v=orders>🧾 My orders</button><button data-a=tab data-v=profile>${pic(S.user.avatar_id,'👤','round sm')}</button><button data-a=out>Sign out</button></span></div><div class=wrap id=main></div>`;main()}
function main(){if(S.tab=='orders')return orders();if(S.tab=='profile')return run(()=>profileView('c/me',$('#main')))();
$('#main').innerHTML=`<div class=hero><span class=fl style="right:7%;top:12%">🍗</span><span class=fl style="right:24%;bottom:6%;animation-delay:1s">🍛</span><span class=fl style="right:3%;bottom:4%;animation-delay:2s">🥤</span><span class=pill>🟢 Open now</span><h1>${greet()}, ${esc(S.user.name.split(' ')[0])}!<br>What are you craving? 😋</h1><p>Fresh from our kitchen to you. Order in a few taps.</p></div><div class=pos><section><input id=q placeholder="Search for a dish…" value="${esc(S.q)}"><div class=cats id=cats></div><div class=grid id=grid></div></section><aside class=cart id=cart></aside></div><a class=cbar href=#cart><span>🛒 View your order</span><b id=cbt></b></a>`;drawMenu();drawCart()}
function drawMenu(){$('#cats').innerHTML=[{name:'All'},...S.cats].map(c=>`<button class="cat ${c.name==S.cat?'on':''}" data-a=cat data-v="${esc(c.name)}">${pic(c.image_id,'🍴','round')}${esc(c.name)}</button>`).join('');
$('#grid').innerHTML=S.prods.filter(p=>(S.cat=='All'||p.category==S.cat)&&p.name.toLowerCase().includes(S.q.toLowerCase())).map(tile).join('')||'<p class=empty>Nothing here right now</p>'}
function drawCart(){const L=Object.entries(S.cart).map(([id,q])=>({p:S.prods.find(x=>x.id==id),q})).filter(x=>x.p),Q=L.reduce((s,x)=>s+x.q,0),T=L.reduce((s,x)=>s+x.p.price*x.q,0)+fee(Q),d=S.type=='dine_in',m=S.method,code=m=='mtn'?S.cfg.mtn:S.cfg.airtel;
if($('#cbt'))$('#cbt').textContent=fmt(T);
$('#cart').innerHTML=`<h3>Your order 🛒</h3>${L.map(x=>`<div class=line><div><b>${esc(x.p.name)}</b><br><small>${fmt(x.p.price)}</small></div><div class=qty><button data-a=dec data-v=${x.p.id}>−</button><b>${x.q}</b><button data-a=add data-v=${x.p.id}>+</button></div></div>`).join('')||'<p class=empty>Tap a dish to add it 🍽️</p>'}${L.length?`<div class=seg style="margin-top:12px"><button class="${d?'on':''}" data-a=type data-v=dine_in>🍽️ Dine in</button><button class="${d?'':'on'}" data-a=type data-v=takeaway>🥡 Take away</button></div><input id=note placeholder="${d?'Table number (optional)':'Note for pickup (optional)'}" value="${esc(S.note)}">${fee(Q)?`<div class=row><small>🥡 Packing · ${Q} plate${Q>1?'s':''}</small><small>${fmt(fee(Q))}</small></div>`:''}<div class=tot><span>Total</span><b>${fmt(T)}</b></div><h3 style="font-size:15px">Pay with</h3><div class=pay>${['cash','mtn','airtel'].map(x=>`<button class="btn pm ${x} ${m==x?'sel':''}" data-a=method data-v=${x}>${x=='cash'?'💵 Cash':PMN[x]}</button>`).join('')}</div>${m=='cash'?'<div class=info>You will pay with cash at the counter.</div>':`<div class=info>Pay <b>${fmt(T)}</b> to ${PMN[m]} merchant code <b>${esc(code)}</b>. Our team will confirm your payment.</div>`}<button class=btn style="margin-top:12px" data-a=order>Place order 🚀</button>`:''}`}
function drawOrders(os){$('#main').innerHTML=`<div class=row><h2>My orders</h2><button class="sm ghost" data-a=tab data-v=orders>↻ Refresh</button></div><div class=ocards>${os.map(o=>{const[t,c]=ST(o);return`<div class="card oc"><div class=row><b>Order #${o.id}</b><span class="badge ${c}">${t}</span></div><div class=tags><span class=tag>${o.order_type=='takeaway'?'🥡 Take away':'🍽️ Dine in'}</span></div>${o.status=='cancelled'?'':tracker(o.stage)}<small>${new Date(o.created_at).toLocaleString()}</small><ul>${(o.items||[]).map(i=>`<li>${i.qty} × ${esc(i.name)}</li>`).join('')}</ul><b class=amt>${fmt(o.total)}</b></div>`}).join('')||'<p class=empty>No orders yet</p>'}</div>`}
const orders=run(async()=>drawOrders(await api('c/orders')));
async function cpoll(){if(!S.user)return;try{const os=await api('c/orders');for(const o of os){const was=S.stages[o.id];if(was&&was!=o.stage&&o.status!='cancelled'){const l=STG.find(x=>x[0]==o.stage);toast(`${l[1]} Order #${o.id}: ${l[2]}!`);beep();if(o.stage=='ready'||o.stage=='delivering')confetti()}S.stages[o.id]=o.stage}if(S.tab=='orders')drawOrders(os)}catch{}}
Object.assign(A,{
mode:v=>{S.mode=v;render()},out:()=>{localStorage.removeItem('ctok');localStorage.removeItem('cuser');S.tok='';S.user=null;S.cart={};render()},
tab:v=>{S.tab=v;main()},cat:v=>{S.cat=v;drawMenu()},
add:v=>{const p=S.prods.find(x=>x.id==v);if(soldout(p))return toast('Sorry, sold out');if(p.stock!=null&&(S.cart[v]||0)>=p.stock)return toast(`Only ${p.stock} plate(s) left`);S.cart[v]=(S.cart[v]||0)+1;drawCart()},
dec:v=>{if(--S.cart[v]<=0)delete S.cart[v];drawCart()},type:v=>{S.type=v;drawCart()},method:v=>{S.method=v;drawCart()},
go:run(async()=>{const b={phone:$('#ph').value,password:$('#pw').value};if(S.mode=='up')b.name=$('#nm').value;const j=await api('c/'+(S.mode=='up'?'register':'login'),'POST',b);S.tok=localStorage.ctok=j.token;S.user=j.user;localStorage.cuser=JSON.stringify(j.user);S.tab='menu';render()}),
order:run(async()=>{try{await api('c/orders','POST',{items:Object.entries(S.cart).map(([id,qty])=>({id:+id,qty})),method:S.method,note:S.note,type:S.type})}catch(e){S.prods=await api('c/menu');S.cart={};drawMenu();drawCart();throw e}S.cart={};S.note='';S.tab='orders';main();confetti();toast('Order placed! We are on it 🎉');S.prods=await api('c/menu')})});
document.addEventListener('input',e=>{const i=e.target.id;if(i=='q'){S.q=e.target.value;drawMenu()}if(i=='note')S.note=e.target.value});
document.addEventListener('submit',e=>{e.preventDefault();A.go()});
setInterval(cpoll,10000);setInterval(async()=>{if(S.user&&S.tab=='menu'){try{S.prods=await api('c/menu');drawMenu()}catch{}}},30000);boot();
</script></body></html>
