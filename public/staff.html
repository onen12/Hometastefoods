function shell(){document.title=(S.cfg.name||'')+' POS';$('#root').innerHTML=S.user?`<div class=app><div class=scrim data-a=nvx></div><nav><div class=nb>${logo()}<div><b>${esc(S.cfg.name)}</b><small>${({admin:'Administrator',rider:'Rider',waiter:'Waitress'})[S.user.role]||'Cashier'}</small></div></div>${NAV.filter(navOk).map(n=>`<button data-a=nav data-v=${n[0]} id=n-${n[0]}>${ic(n[1])}<span>${n[2]}</span>${n[0]=='orders'||n[0]=='rider'?'<i class="bdg ob"></i>':n[0]=='messages'?'<i class="bdg mbd"></i>':''}</button>`).join('')}<div class=sp></div><button data-a=alerts>${ic('bell')}<span>${localStorage.pushOn?'Test order alerts':'Enable order alerts'}</span></button><button data-a=install>${ic('download')}<span>Install app</span></button><button data-a=out>${ic('logout')}<span>Sign out</span></button></nav><div class=mw><header class=tb><button class=ib data-a=nvo>${ic('menu',24)}</button><b id=ttl></b><span class=sp></span><button class=ib id=tcart data-a=copen hidden>${ic('bag',22)}<i class=bdg id=cc></i></button><button class=ib data-a=nav data-v=${S.user.role=='rider'?'rider':'orders'}>${ic('bell',22)}<i class="bdg ob"></i></button></header><main id=main></main></div></div><button class=cbar id=cbar data-a=copen></button>`:LOGIN();if(S.user)show()}

async function poll(){if(!S.user||S.user.role=='rider')return;pollChats();try{const os=await api('orders'),on=os.filter(o=>o.source=='online'&&o.stage=='received'&&o.status!='cancelled'),nw=S.seen?on.filter(o=>!S.seen.has(o.id)):[],key=os.map(o=>o.id+o.status+o.stage).join();
 S.seen=new Set(on.map(o=>o.id));S.nOn=on.length;setDot();
 if(AL.id&&!on.some(o=>o.id==AL.id))alarmStop();if(nw.length){alarmStart(nw[0]);toast(`New order #${nw[0].id} from ${nw[0].customer}`)}
 if(key!=S.key){S.key=key;if(S.view=='orders')views.orders()}}catch{}}

async function rpoll(){if(!S.user||S.user.role!='rider')return;try{const os=await api('rider/orders'),ids=os.filter(o=>o.stage!='done').map(o=>o.id),nw=S.rseen?ids.filter(i=>!S.rseen.has(i)):[],k=os.map(o=>o.id+o.stage+o.status).join();S.rseen=new Set(ids);S.nOn=ids.length;setDot();if(nw.length){ring();navigator.vibrate?.([300,150,300]);toast('New delivery assigned to you')}if(k!=S.rk){S.rk=k;if(S.view=='rider'||S.view=='rcash')views[S.view]()}}catch{}}

function drawThread(){$('#main').innerHTML=`<div class=pg><div class=row><button class="sm ghost" data-a=chatback>${ic('left',15)} Back</button><b>${esc(S.chatName)}</b>${S.chatPhone?`<a class="sm ghost" href="${telHref(S.chatPhone)}">${ic('phone',15)} Call</a>`:'<span></span>'}</div><div class="card chatc"><div class=msgs id=smsgs></div><div class=cin><input id=smsg placeholder="Type a reply" autocomplete=off><button class=btn data-a=chatsend aria-label=Send>${ic('send',20)}</button></div></div></div>`;fillThread()}

async function pollChats(){if(!S.user||['rider','waiter'].includes(S.user.role))return;try{const cs=await api('chats'),un=cs.reduce((t,c)=>t+c.unread,0),k=JSON.stringify(cs.map(c=>[c.id,c.unread,c.last]));if(S.msgInit&&un>S.nMsg&&!(S.view=='messages'&&S.chatId)){toast('New customer message');beep()}S.nMsg=un;S.msgInit=1;S.chats=cs;setDot();if(S.view=='messages'){if(S.chatId){const m=await api('chats/'+S.chatId);if(m.length!=S.thr.length){S.thr=m;fillThread()}}else if(k!=S.mk){S.mk=k;views.messages()}}}catch{}}

ee()?`<small>MTN and Airtel add ${fmt(mfee())} to cover withdrawal charges.</small>`:''}<div class=payrow><button class="pb cash" ${off} data-a=pay data-v=cash>${ic('cash',22)}Cash</button><button class="pb mtn" ${off} data-a=pay data-v=mtn>${ic('mobile',22)}MTN MoMo${mfee()?`<small>+${mfee().toLocaleString()}</small>`:''}</button><button class="pb airtel" ${off} data-a=pay data-v=airtel>${ic('mobile',22)}Airtel Money${mfee()?`<small>+${mfee().toLocaleString()}</small>`:''}</button></div><button class="btn ghost" ${off} data-a=pay data-v=hold>Save as open order</button></div>`;

rcopy:v=>{navigator.clipboard?.writeText(riderText(S.orders.find(o=>o.id==v)));toast('Rider details copied')},
rwa:v=>{const o=S.orders.find(x=>x.id==v);window.open(o.rider_phone?waHref(o.rider_phone,riderText(o)):'https://wa.me/?text='+encodeURIComponent(riderText(o)),'_blank')},
chatopen:v=>{const c=(S.chats||[]).find(x=>x.id==v);S.chatId=+v;S.chatName=c?c.name:'Customer';S.chatPhone=c?c.phone:'';views.messages()},
chatback:()=>{S.chatId=null;views.messages()},
chatsend:run(async()=>{const i=$('#smsg'),b=i.value.trim();if(!b)return;i.value='';await api('chats/'+S.chatId,'POST',{body:b});S.thr=await api('chats/'+S.chatId);fillThread()}),
cmsg:v=>{const c=(S.custs||[]).find(x=>x.id==v);S.chatId=+v;S.chatName=c?c.name:'Customer';S.chatPhone=c?c.phone:'';S.view='messages';show()},
radd:run(async()=>{await api('users','POST',{name:$('#rn').value,phone:$('#rp').value,email:$('#re').value,password:$('#rpw').value,role:'rider'});toast('Rider registered');views.riders()}),
rsettle:run(async v=>{if(confirm('Confirm you have received the cash from this rider?')){await api(`riders/${v}/settle`,'POST');toast('Cash settled');views.riders()}}),
assign:run(async v=>{const rid=document.querySelector('#rs'+v).value;await api(`orders/${v}/assign`,'POST',{rider_id:rid||null});toast(rid?'Rider assigned and alerted':'Rider removed');views.orders()}),
rstart:run(async v=>{await api(`rider/orders/${v}/start`,'POST');views.rider()}),
rdone:run(async v=>{const[id,c]=v.split(':'),o=S.rorders.find(x=>x.id==id);if(c=='1'&&!confirm(`Confirm you collected ${fmt(o.total)} in cash?`))return;await api(`rider/orders/${id}/deliver`,'POST',{collected:c=='1'});toast('Delivery completed');views.rider()}),
logopic:()=>pick(async id=>{S.cfg=await api('settings','PUT',{logo:id});shell();toast('Logo updated')},{max:500,png:true}),
ssave:run(async()=>{S.cfg=await api('settings','PUT',{name:$('#sn').value,address:$('#sa').value,phones:$('#sp').value,mtn:$('#sm').value,airtel:$('#sl').value,packing:$('#sf').value,momo_fee:$('#smf').value,delivery_fee:$('#sdf').value,whatsapp:$('#sw').value,email:$('#se').value,facebook:$('#sfb').value,instagram:$('#sig').value,founded:$('#syr').value,hide_soldout:$('#sh').value});shell();toast('Settings saved')})});
document.addEventListener('input',e=>{const i=e.target.id;if(i=='q'){S.q=e.target.value;drawGrid()}if(i=='cust')S.cust=e.target.value;if(i=='table')S.table=e.target.value;if(i=='addr')S.addr=e.target.value;if(i=='ins')S.ins=e.target.value;if(i=='cph')S.cph=e.target.value;if(['cust','table','addr','ins','cph'].includes(i))sv()});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='smsg'){e.preventDefault();A.chatsend()}});
document.addEventListener('submit',run(async e=>{e.preventDefault();const j=await api('login','POST',{email:$('#em').value,password:$('#pw').value});S.tok=localStorage.tok=j.token;S.user=j.user;localStorage.user=JSON.stringify(j.user);S.view=j.user.role=='rider'?'rider':'pos';S.seen=null;S.rseen=null;boot()}));
setInterval(poll,10000);setInterval(rpoll,10000);boot();
</script></body></html>
