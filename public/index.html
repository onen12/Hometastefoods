<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home Taste Foods POS</title>
<style>
:root{--bg:#f7f5f0;--ink:#1f1d18;--mut:#7a7566;--brand:#d9480f;--card:#fff;--line:#e9e5da;--ok:#2b8a3e;--r:14px}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit}button{cursor:pointer;border:0}h2,h3{margin:0 0 12px}small{color:var(--mut)}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}input:focus,select:focus{outline:2px solid var(--brand);border-color:transparent}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:var(--ink);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
nav h1{font-size:17px;margin:0 8px 18px;line-height:1.25}nav h1 small{display:block;color:#a9a493;font-weight:400;font-size:12px;margin-top:4px}
nav button{background:none;color:#cfcab9;text-align:left;padding:11px 12px;border-radius:10px}nav button.on{background:var(--brand);color:#fff}nav button:hover:not(.on){background:#2d2a23}nav .sp{flex:1}
main{padding:22px;min-width:0}
.pos{display:grid;grid-template-columns:1fr 370px;gap:20px;align-items:start}
.chips{display:flex;gap:8px;overflow:auto;margin:14px 0;padding-bottom:2px}.chip{padding:8px 16px;border-radius:99px;background:#fff;border:1px solid var(--line);white-space:nowrap}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:96px;transition:.15s}
.tile:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:0 6px 16px #0001}.tile:active{transform:scale(.97)}.tile span{color:var(--brand);font-weight:700}
.card,.cart{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}.cart{position:sticky;top:22px}
.two{display:grid;grid-template-columns:1fr 100px;gap:8px;margin-bottom:12px}
.line{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:10px}.qty button{width:30px;height:30px;border-radius:50%;background:var(--bg);font-size:18px}
.tot{display:flex;justify-content:space-between;font-size:20px;margin:14px 0}.tot b{color:var(--brand)}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.btn{width:100%;padding:13px;border-radius:12px;background:var(--ok);color:#fff;font-weight:700}.btn.mo{background:#e8a200;color:#1f1d18}.btn.ghost{background:var(--bg);color:var(--ink)}.btn.link{background:none;color:var(--mut)}
.sm{padding:7px 12px;border-radius:9px;background:var(--ok);color:#fff;font-size:13px}.sm.mo{background:#e8a200;color:#1f1d18}.sm.ghost{background:var(--bg);color:var(--ink)}
.empty{color:var(--mut);text-align:center;padding:24px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0}.acts{display:flex;gap:6px;flex-wrap:wrap}
.ocards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.ocards ul{margin:8px 0;padding-left:18px}
.badge{padding:3px 10px;border-radius:99px;font-size:12px;background:var(--bg)}.badge.open{background:#fff3bf}.badge.paid{background:#d3f9d8;color:#1b6b2a}.badge.cancelled{background:#ffe3e3;color:#c92a2a}
.addp{display:grid;grid-template-columns:2fr 1.2fr 1fr auto;gap:8px}table{width:100%;border-collapse:collapse}td{padding:5px}tr.off{opacity:.45}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:16px}.stats h3{font-size:22px;margin:4px 0 0}
.two2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.bars{display:flex;gap:10px;height:190px;align-items:flex-end}
.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}.bar i{width:100%;background:var(--brand);border-radius:8px 8px 0 0;min-height:3px}
.login{max-width:340px;margin:12vh auto;background:#fff;padding:28px;border-radius:18px;border:1px solid var(--line);display:grid;gap:12px;text-align:center}.login h1{margin:0}.login p{margin:0;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s}#toast.show{opacity:1;transform:translate(-50%,0)}
#rcpt{display:none;width:280px;font:12px/1.4 monospace}#rcpt h2{text-align:center;margin:0}#rcpt p{margin:6px 0}#rcpt .ln{display:flex;justify-content:space-between}#rcpt .b{font-weight:700;font-size:14px}
@media(max-width:860px){.app{grid-template-columns:1fr}nav{position:fixed;bottom:0;top:auto;height:auto;width:100%;flex-direction:row;z-index:5;padding:6px;overflow:auto}nav h1,nav .sp{display:none}nav button{white-space:nowrap}main{padding:14px 14px 84px}.pos,.two2{grid-template-columns:1fr}.cart{position:static}.addp{grid-template-columns:1fr 1fr}}
@media print{body>*:not(#rcpt){display:none!important}#rcpt{display:block!important}}
</style></head><body><div id="root"></div><div id="rcpt"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),fmt=n=>'UGX '+Math.round(n).toLocaleString(),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S={tok:localStorage.tok||'',user:JSON.parse(localStorage.user||'null'),view:'pos',prods:[],cart:{},cat:'All',q:'',cust:'',table:'',tab:'',orders:[]};
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='show';setTimeout(()=>t.className='',2600)};
async function api(p,m='GET',b){const r=await fetch('/api/'+p,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+S.tok},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok){if(r.status==401&&S.tok)A.out();throw new Error(j.error||'Something went wrong')}return j}
const run=f=>async(...a)=>{try{await f(...a)}catch(e){toast(e.message)}};
const NAV=[['pos','🍽️ New order'],['orders','🧾 Orders'],['menu','📋 Menu','admin'],['reports','📊 Reports','admin'],['staff','👥 Staff','admin']];
const LOGIN=`<form class=login id=lf><h1>🍽️ Home Taste Foods</h1><p>Sign in to the POS</p><input id=em type=email placeholder=Email required><input id=pw type=password placeholder=Password required><button class=btn>Sign in</button></form>`;
function shell(){$('#root').innerHTML=S.user?`<div class=app><nav><h1>Home Taste Foods<small>${esc(S.user.name)} · ${S.user.role}</small></h1>${NAV.filter(n=>!n[2]||n[2]==S.user.role).map(n=>`<button data-a=nav data-v=${n[0]} id=n-${n[0]}>${n[1]}</button>`).join('')}<div class=sp></div><button data-a=out>Sign out</button></nav><main id=main></main></div>`:LOGIN;if(S.user)run(async()=>{S.prods=await api('products');show()})()}
function show(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.id=='n-'+S.view));views[S.view]()}
const rcpt=o=>{$('#rcpt').innerHTML=`<h2>HOME TASTE FOODS</h2><p style="text-align:center">Kansanga Ggabba Road, next to KIU<br>0750541790 / 0788507153</p><hr><p>Order #${o.id} · ${new Date(o.created_at).toLocaleString()}<br>${esc(o.customer)}${o.table_no?' · Table '+esc(o.table_no):''}</p><hr>${(o.items||[]).map(i=>`<div class=ln><span>${i.qty} × ${esc(i.name)}</span><span>${(i.price*i.qty).toLocaleString()}</span></div>`).join('')}<hr><div class="ln b"><span>TOTAL</span><span>${fmt(o.total)}</span></div><p>${o.status=='paid'?'Paid by '+(o.method=='momo'?'Mobile Money':'Cash'):'UNPAID'}</p><p style="text-align:center">Thank you, come again!</p>`;setTimeout(()=>window.print(),150)};
function drawPos(){const act=S.prods.filter(p=>p.active),cats=['All',...new Set(act.map(p=>p.category))];
$('#chips').innerHTML=cats.map(c=>`<button class="chip ${c==S.cat?'on':''}" data-a=cat data-v="${esc(c)}">${esc(c)}</button>`).join('');
$('#grid').innerHTML=act.filter(p=>(S.cat=='All'||p.category==S.cat)&&p.name.toLowerCase().includes(S.q.toLowerCase())).map(p=>`<button class=tile data-a=add data-v=${p.id}><b>${esc(p.name)}</b><span>${fmt(p.price)}</span></button>`).join('')||'<p class=empty>No items</p>'}
function drawCart(){const L=Object.entries(S.cart).map(([id,q])=>({p:S.prods.find(x=>x.id==id),q})).filter(x=>x.p),T=L.reduce((s,x)=>s+x.p.price*x.q,0);
$('#cart').innerHTML=`<h3>Current order</h3><div class=two><input id=cust placeholder="Customer (optional)" value="${esc(S.cust)}"><input id=table placeholder="Table" value="${esc(S.table)}"></div>${L.map(x=>`<div class=line><div><b>${esc(x.p.name)}</b><br><small>${fmt(x.p.price)}</small></div><div class=qty><button data-a=dec data-v=${x.p.id}>−</button><b>${x.q}</b><button data-a=add data-v=${x.p.id}>+</button></div></div>`).join('')||'<p class=empty>Tap a menu item to add it</p>'}<div class=tot><span>Total</span><b>${fmt(T)}</b></div><div class=pay><button class=btn data-a=pay data-v=cash>💵 Cash</button><button class="btn mo" data-a=pay data-v=momo>📱 Mobile Money</button></div><button class="btn ghost" data-a=pay data-v=hold>Save as open order</button>${L.length?'<button class="btn link" data-a=clear>Clear order</button>':''}`}
const views={
pos(){$('#main').innerHTML=`<div class=pos><section><input id=q placeholder="Search menu…" value="${esc(S.q)}"><div class=chips id=chips></div><div class=grid id=grid></div></section><aside class=cart id=cart></aside></div>`;drawPos();drawCart()},
orders:run(async()=>{const os=S.orders=await api('orders'+(S.tab?'?status='+S.tab:''));$('#main').innerHTML=`<h2>Orders</h2><div class=chips>${[['','All'],['open','Open'],['paid','Paid']].map(([v,l])=>`<button class="chip ${S.tab==v?'on':''}" data-a=tab data-v="${v}">${l}</button>`).join('')}</div><div class=ocards>${os.map(o=>`<div class=card><div class=row><b>#${o.id} ${esc(o.customer)}${o.table_no?' · T'+esc(o.table_no):''}</b><span class="badge ${o.status}">${o.status}</span></div><small>${new Date(o.created_at).toLocaleString()} · ${esc(o.cashier||'')}</small><ul>${(o.items||[]).map(i=>`<li>${i.qty} × ${esc(i.name)}</li>`).join('')}</ul><div class=row><b>${fmt(o.total)}</b><div class=acts>${o.status=='open'?`<button class=sm data-a=opay data-v="${o.id}:cash">Cash</button><button class="sm mo" data-a=opay data-v="${o.id}:momo">MoMo</button><button class="sm ghost" data-a=ocancel data-v=${o.id}>Cancel</button>`:''}<button class="sm ghost" data-a=print data-v=${o.id}>Print</button></div></div></div>`).join('')||'<p class=empty>No orders yet</p>'}</div>`}),
menu(){$('#main').innerHTML=`<h2>Menu</h2><div class="card addp"><input id=np placeholder="Item name"><input id=nc placeholder="Category (e.g. Drinks)"><input id=nr type=number placeholder="Price UGX"><button class="btn" data-a=padd>Add</button></div><div class=card style="margin-top:16px"><table>${S.prods.map(p=>`<tr class="${p.active?'':'off'}" data-id=${p.id}><td><input value="${esc(p.name)}"></td><td><input value="${esc(p.category)}"></td><td><input type=number value=${p.price}></td><td><div class=acts><button class=sm data-a=psave data-v=${p.id}>Save</button><button class="sm ghost" data-a=ptog data-v=${p.id}>${p.active?'Hide':'Show'}</button><button class="sm ghost" data-a=pdel data-v=${p.id}>✕</button></div></td></tr>`).join('')}</table></div>`},
reports:run(async()=>{const d=await api('reports'),m=k=>(d.methods.find(x=>x.method==k)||{sum:0}).sum,mx=Math.max(1,...d.week.map(w=>w.sum));$('#main').innerHTML=`<h2>Today</h2><div class=stats>${[['Sales today',fmt(d.today.sum)],['Paid orders',d.today.n],['Cash',fmt(m('cash'))],['Mobile Money',fmt(m('momo'))]].map(([a,b])=>`<div class=card><small>${a}</small><h3>${b}</h3></div>`).join('')}</div><div class=two2><div class=card><h3>Last 7 days</h3><div class=bars>${d.week.map(w=>`<div class=bar><small>${w.sum?Math.round(w.sum/1000)+'k':''}</small><i style="height:${w.sum/mx*85}%"></i><small>${w.day}</small></div>`).join('')}</div></div><div class=card><h3>Top items (30 days)</h3>${d.top.map((t,i)=>`<div class=row><span>${i+1}. ${esc(t.name)}</span><b>${t.qty}</b></div>`).join('')||'<p class=empty>No sales yet</p>'}</div></div>`}),
staff:run(async()=>{const us=await api('users');$('#main').innerHTML=`<h2>Staff</h2><div class="card addp"><input id=un placeholder="Full name"><input id=ue type=email placeholder="Email"><input id=up type=password placeholder="Password (8+)"><select id=ur><option value=cashier>Cashier</option><option value=admin>Admin</option></select></div><button class="btn" style="margin:10px 0 16px" data-a=uadd>Add staff member</button><div class=card>${us.map(u=>`<div class=row><span><b>${esc(u.name)}</b> <small>${esc(u.email)}</small></span><span class=acts><span class=badge>${u.role}</span>${u.id==S.user.id?'':`<button class="sm ghost" data-a=udel data-v=${u.id}>Remove</button>`}</span></div>`).join('')}</div>`})};
const reload=async()=>{S.prods=await api('products');views[S.view]()},rowVals=id=>[...document.querySelector(`tr[data-id="${id}"]`).querySelectorAll('input')].map(i=>i.value);
const A={
nav:v=>{S.view=v;show()},
out:()=>{localStorage.clear();S.tok='';S.user=null;S.cart={};shell()},
cat:v=>{S.cat=v;drawPos()},add:v=>{S.cart[v]=(S.cart[v]||0)+1;drawCart()},
dec:v=>{if(--S.cart[v]<=0)delete S.cart[v];drawCart()},clear:()=>{S.cart={};drawCart()},
pay:run(async m=>{const o=await api('orders','POST',{customer:S.cust,table:S.table,method:m=='hold'?null:m,items:Object.entries(S.cart).map(([id,qty])=>({id:+id,qty}))});S.cart={};S.cust=S.table='';drawCart();toast(o.status=='paid'?'Payment recorded ✓':'Order saved ✓');if(o.status=='paid')rcpt(o)}),
tab:v=>{S.tab=v;views.orders()},
opay:run(async v=>{const[id,m]=v.split(':');await api(`orders/${id}/pay`,'POST',{method:m});toast('Payment recorded ✓');views.orders()}),
ocancel:run(async v=>{if(confirm('Cancel this order?')){await api(`orders/${v}/cancel`,'POST');views.orders()}}),
print:v=>rcpt(S.orders.find(o=>o.id==v)),
padd:run(async()=>{await api('products','POST',{name:$('#np').value,category:$('#nc').value,price:$('#nr').value});await reload();toast('Item added ✓')}),
psave:run(async v=>{const[n,c,p]=rowVals(v);await api('products/'+v,'PUT',{name:n,category:c,price:p,active:S.prods.find(x=>x.id==v).active});await reload();toast('Saved ✓')}),
ptog:run(async v=>{const p=S.prods.find(x=>x.id==v);await api('products/'+v,'PUT',{...p,active:!p.active});await reload()}),
pdel:run(async v=>{if(confirm('Delete this item? Past orders keep their records.')){await api('products/'+v,'DELETE');delete S.cart[v];await reload()}}),
uadd:run(async()=>{await api('users','POST',{name:$('#un').value,email:$('#ue').value,password:$('#up').value,role:$('#ur').value});toast('Staff added ✓');views.staff()}),
udel:run(async v=>{if(confirm('Remove this staff member?')){await api('users/'+v,'DELETE');views.staff()}})};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t)A[t.dataset.a](t.dataset.v)});
document.addEventListener('input',e=>{const i=e.target.id;if(i=='q'){S.q=e.target.value;drawPos()}if(i=='cust')S.cust=e.target.value;if(i=='table')S.table=e.target.value});
document.addEventListener('submit',run(async e=>{e.preventDefault();const j=await api('login','POST',{email:$('#em').value,password:$('#pw').value});S.tok=localStorage.tok=j.token;S.user=j.user;localStorage.user=JSON.stringify(j.user);S.view='pos';shell()}));
shell();
</script></body></html>
