<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Order online</title><link rel="stylesheet" href="/style.css"><link rel="manifest" href="/order.webmanifest"><meta name="theme-color" content="#ff6a13"><link rel="apple-touch-icon" href="/icon-192.png"></head>
<body><div id="root"></div><div id="toast"></div>
<script src="/common.js"></script>
<script>
const S={tok:localStorage.ctok||'',user:JSON.parse(localStorage.cuser||'null'),prods:[],cats:[],cfg:{},cart:{},cat:'All',q:'',mode:'in',tab:'menu',type:'dine_in',method:'cash',note:'',stages:{}};
const getTok=()=>S.tok,onAuthFail=()=>A.out();
const logo=()=>`<img class=logo src="${S.cfg.logo?'/img/'+S.cfg.logo:'/logo.svg'}" alt="logo">`;
const fee=q=>S.type=='takeaway'?(+S.cfg.packing||0)*q:0;
const ST=o=>o.status=='paid'?['Paid','paid']:o.status=='cancelled'?['Cancelled','cancelled']:[o.pay_pref=='cash'?'Pay at counter':'Confirming payment','open'];
const boot=run(async()=>{[S.cfg,S.cats,S.prods]=await Promise.all([api('settings'),api('categories'),api('c/menu')]);document.title='Order · '+S.cfg.name;render()});
const onProfile=run(async()=>{Object.assign(S.user,await api('c/me'));localStorage.cuser=JSON.stringify(S.user);render()});
const qty=()=>Object.values(S.cart).reduce((a,b)=>a+b,0);
function render(){
if(!S.user){$('#root').innerHTML=`<div class=auth><div class=ah>${logo()}<h1>${esc(S.cfg.name)}</h1><p>Delicious meals, hot from our kitchen. Order in a few taps and follow it live.</p><ul><li>${ic('utensils')}Fresh, made-to-order meals</li><li>${ic('bike')}Track your order live</li><li>${ic('cash')}Pay with cash or mobile money</li></ul></div><div class=af><form><h2>${S.mode=='in'?'Welcome back':'Create account'}</h2><small>${S.mode=='in'?'Sign in to start ordering.':'It takes less than a minute.'}</small>${S.mode=='up'?`<div class=fld>${ic('user',18)}<input id=nm placeholder="Full name" required></div>`:''}<div class=fld>${ic('phone',18)}<input id=ph type=tel placeholder="Phone number" required></div><div class=fld>${ic('lock',18)}<input id=pw type=password placeholder="Password (6+ characters)" required></div><button class="btn big">${S.mode=='in'?'Sign in':'Create account'}</button><small>${S.mode=='in'?'New here? <a href=# data-a=mode data-v=up>Create an account</a>':'Have an account? <a href=# data-a=mode data-v=in>Sign in</a>'}</small><small class=stafflink><a href=/staff>Staff sign in</a></small></form></div></div>`;return}
const T=(v,l,i)=>`<button data-a=tab data-v=${v}>${ic(i)}<span>${l}</span></button>`;
$('#root').innerHTML=`<div class=scrim data-a=nvx></div><aside class=dr><div class=nb>${logo()}<div><b>${esc(S.user.name)}</b><small>${esc(S.user.phone||'')}</small></div></div>${T('menu','Menu','utensils')}${T('orders','My orders','receipt')}${T('profile','My profile','user')}<div class=sp></div><button data-a=install>${ic('download')}<span>Install app</span></button><button data-a=out>${ic('logout')}<span>Sign out</span></button></aside><header class=top><button class="ib hb" data-a=nvo>${ic('menu',24)}</button><div class=tbrand>${logo()}<span>${esc(S.cfg.name)}</span></div><div class=tl>${[['menu','Menu'],['orders','My orders'],['profile','Profile']].map(([v,l])=>`<button class="${S.tab==v?'on':''}" data-a=tab data-v=${v}>${l}</button>`).join('')}</div><button class="ib cic" data-a=copen>${ic('bag',22)}<i class=bdg id=cb></i></button></header><div class=wrap id=main></div><button class=cbar id=cbar data-a=copen></button>`;main()}
function main(){document.body.classList.remove('nv','lock');$('#cbar').innerHTML='';
if(S.tab=='orders')return orders();if(S.tab=='profile')return run(()=>profileView('c/me',$('#main')))();
$('#main').innerHTML=`<div class=hero><h1>${greet()}, ${esc(S.user.name.split(' ')[0])}.<br>What are you craving?</h1><p>Fresh from our kitchen to you.</p><div class=sb>${ic('search',20)}<input id=q placeholder="Search for a dish" value="${esc(S.q)}"></div></div><div class=pos><section><div class=cats id=cats></div><div id=sp></div><div class=sh2><h3>Our menu</h3></div><div class=grid id=grid></div></section><aside class=cart id=cart></aside></div>`;drawMenu();drawCart()}
function drawGrid(){const f=S.prods.filter(p=>(S.cat=='All'||p.category==S.cat)&&p.name.toLowerCase().includes(S.q.toLowerCase())),sp=S.prods.filter(p=>p.offer_percent>0&&!soldout(p));$('#sp').innerHTML=S.cat=='All'&&!S.q&&sp.length?`<div class=spbox><div class=sph>${ic('tag',20)}<div><h3>Special offers</h3><small>Limited deals, grab them while they last</small></div></div><div class=grid>${sp.map(p=>tile(p,S.cart[p.id]||0)).join('')}</div></div>`:'';$('#grid').innerHTML=f.map(p=>tile(p,S.cart[p.id]||0)).join('')||'<p class=empty>Nothing here right now</p>'}
function drawMenu(){$('#cats').innerHTML=[{name:'All',all:1},...S.cats].map(c=>`<button class="cat ${c.name==S.cat?'on':''}" data-a=cat data-v="${esc(c.name)}">${c.all?`<div class="pic ph round">${ic('grid',26)}</div>`:pic(c.image_id,'utensils','round')}<span>${esc(c.name)}</span></button>`).join('');drawGrid()}
function drawCart(){const L=Object.entries(S.cart).map(([id,q])=>({p:S.prods.find(x=>x.id==id),q})).filter(x=>x.p),Q=L.reduce((s,x)=>s+x.q,0),QP=L.filter(x=>x.p.pack).reduce((s,x)=>s+x.q,0),sub=L.reduce((s,x)=>s+ep(x.p)*x.q,0),F=fee(QP),m=S.method,MF=(m=='mtn'||m=='airtel')?(+S.cfg.momo_fee||0):0,T=sub+F+MF,d=S.type=='dine_in',code=m=='mtn'?S.cfg.mtn:S.cfg.airtel,pk=+S.cfg.packing||0;
const cb=$('#cb');if(cb)cb.textContent=Q||'';
if($('#cbar'))$('#cbar').innerHTML=Q?`<span class=cl>${ic('bag',20)}<b>${Q}</b></span><span>View cart</span><span>${fmt(T)}</span>`:'';
const pc=(x,b)=>`<button class="pc ${m==x?'on':''}" data-a=method data-v=${x}>${b}<b>${PMN[x]}</b>${x!='cash'&&(+S.cfg.momo_fee||0)?`<small>+${fmt(+S.cfg.momo_fee)} fee</small>`:''}</button>`;
$('#cart').innerHTML=`<div class=sh-head><button class=ib data-a=cclose>${ic('left',22)}</button><h3>${L.length?'Checkout':'Your cart'}</h3></div>${L.length?`
<div class=sec><h4>Your order</h4>${L.map(x=>`<div class=ln2>${pic(x.p.image_id,'utensils','sq')}<div class=g><b>${esc(x.p.name)}</b><small>${fmt(ep(x.p))}</small></div><div class=qs><button data-a=dec data-v=${x.p.id}>${ic('minus',16)}</button><b>${x.q}</b><button data-a=add data-v=${x.p.id}>${ic('plus',16)}</button></div></div>`).join('')}</div>
<div class=sec><h4>How would you like it?</h4><div class=opts><button class="opt ${d?'on':''}" data-a=type data-v=dine_in>${ic('utensils',22)}<b>Dine in</b><small>Eat at the restaurant</small></button><button class="opt ${d?'':'on'}" data-a=type data-v=takeaway>${ic('bag',22)}<b>Take away</b><small>Packed to go${pk?' · +'+fmt(pk)+' per food plate (drinks free)':''}</small></button></div><div class=fld>${ic('pencil',18)}<input id=note placeholder="${d?'Table number (optional)':'Note for pickup (optional)'}" value="${esc(S.note)}"></div></div>
<div class=sec><h4>Payment</h4><div class=pays>${pc('cash',`<span class="bg cashb">${ic('cash',18)}</span>`)}${pc('mtn','<span class="bg mtnb">MTN</span>')}${pc('airtel','<span class="bg airb">airtel</span>')}</div>${m=='cash'?'<div class=codec style="margin-top:12px"><small>You will pay with cash at the counter.</small></div>':`<div class=codec><small>${PMN[m]} merchant code</small><div class=code>${esc(code)}<button class=cp data-a=copy data-v="${esc(code)}">${ic('copy',16)} Copy</button></div><small>Pay ${fmt(T)} to this code (includes ${fmt(MF)} mobile money fee to cover withdrawal charges). Our team will confirm your payment.</small></div>`}</div>
<div class=sec><div class=sum><div><span>Subtotal</span><span>${fmt(sub)}</span></div>${F?`<div><span>Packing (${QP} plate${QP>1?'s':''})</span><span>${fmt(F)}</span></div>`:''}${MF?`<div><span>Mobile money fee</span><span>${fmt(MF)}</span></div>`:''}<div class=t><span>Total</span><span>${fmt(T)}</span></div></div></div>
<div class=foot><button class="btn big" data-a=order>Place order · ${fmt(T)}</button><small class=fine>Your order goes straight to our kitchen.</small></div>`:`<div class=emptyc>${ic('bag',44)}<h4>Your cart is empty</h4><p>Add dishes from the menu to get started.</p><button class="btn ghost" style="width:auto;padding:0 22px" data-a=cclose>Browse menu</button></div>`}`}
function drawOrders(os){$('#main').innerHTML=`<div class=pg><div class=row><h2 style="margin-top:0">My orders</h2><button class="sm ghost" data-a=tab data-v=orders>Refresh</button></div><div class=ocards>${os.map(o=>{const[t,c]=ST(o),tk=o.order_type=='takeaway';return`<div class="card oc"><div class=row><b>Order #${o.id}</b><span class="badge ${c}">${t}</span></div><div class=tags><span class=tag>${ic(tk?'bag':'utensils',13)} ${tk?'Take away':'Dine in'}</span><span class=tag>${new Date(o.created_at).toLocaleString([],{dateStyle:'short',timeStyle:'short'})}</span></div>${o.status=='cancelled'?'':tracker(o.stage)}<ul class=its>${(o.items||[]).map(i=>`<li>${i.qty} × ${esc(i.name)}</li>`).join('')}</ul><div class=amtr><span>Total</span><span>${fmt(o.total)}</span></div></div>`}).join('')||'<p class=empty>No orders yet</p>'}</div></div>`}
const orders=run(async()=>drawOrders(await api('c/orders')));
async function cpoll(){if(!S.user)return;try{const os=await api('c/orders');for(const o of os){const was=S.stages[o.id];if(was&&was!=o.stage&&o.status!='cancelled'){const l=STG.find(x=>x[0]==o.stage);toast(`Order #${o.id}: ${l[2]}`);beep();if(o.stage=='ready'||o.stage=='delivering')confetti()}S.stages[o.id]=o.stage}if(S.tab=='orders')drawOrders(os)}catch{}}
const addToCart=(id,q,quiet)=>{const p=S.prods.find(x=>x.id==id);if(!p||soldout(p))return toast('Sorry, sold out');const have=S.cart[id]||0;if(p.stock!=null&&have+q>p.stock)return toast(`Only ${p.stock} plate(s) left`);S.cart[id]=have+q;drawGrid();drawCart();if(!quiet)toast(`${q} x ${p.name} added to cart`)};
Object.assign(A,{
mode:v=>{S.mode=v;render()},out:()=>{localStorage.removeItem('ctok');localStorage.removeItem('cuser');S.tok='';S.user=null;S.cart={};render()},
tab:v=>{S.tab=v;render()},cat:v=>{S.cat=v;drawMenu()},
copen:()=>{if(S.tab!='menu'){S.tab='menu';render()}$('#cart').classList.add('open');document.body.classList.add('lock')},
add:v=>addToCart(v,1,1),
dec:v=>{if(--S.cart[v]<=0)delete S.cart[v];drawGrid();drawCart()},type:v=>{S.type=v;drawCart()},method:v=>{S.method=v;drawCart()},
go:run(async()=>{const b={phone:$('#ph').value,password:$('#pw').value};if(S.mode=='up')b.name=$('#nm').value;const j=await api('c/'+(S.mode=='up'?'register':'login'),'POST',b);S.tok=localStorage.ctok=j.token;S.user=j.user;localStorage.cuser=JSON.stringify(j.user);S.tab='menu';render()}),
order:run(async()=>{try{await api('c/orders','POST',{items:Object.entries(S.cart).map(([id,qty])=>({id:+id,qty})),method:S.method,note:S.note,type:S.type})}catch(e){S.prods=await api('c/menu');S.cart={};drawGrid();drawCart();throw e}S.cart={};S.note='';S.tab='orders';render();confetti();toast('Order placed. We are on it!');S.prods=await api('c/menu')})});
document.addEventListener('input',e=>{const i=e.target.id;if(i=='q'){S.q=e.target.value;drawGrid()}if(i=='note')S.note=e.target.value});
document.addEventListener('submit',e=>{e.preventDefault();A.go()});
setInterval(cpoll,10000);setInterval(async()=>{if(S.user&&S.tab=='menu'&&!document.body.classList.contains('lock')){try{S.prods=await api('c/menu');drawGrid()}catch{}}},30000);boot();
</script></body></html>
